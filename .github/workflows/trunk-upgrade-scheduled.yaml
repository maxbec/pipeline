# This repository's own weekly Trunk Upgrade. It calls the reusable workflow
# of its own tree, like ci.yaml and train-self.yaml do: a tag such as @v3 kept
# running a version from 2026-08 that no later fix reached.
---
name: 🧰 Trunk Upgrade

on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch: {}

permissions: {}

jobs:
  upgrade:
    # Job-level permissions cap the reusable workflow's job permissions.
    # The called workflow needs contents+pull-requests write to push a
    # branch and open a PR with the upgrade diff.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/trunk-upgrade.yaml
    secrets: inherit
