---
# The universal pipeline, slim (Flaiky Phase 10, D34 / D42). Three jobs:
#
#   Guard   parses .github/pipeline.yaml (v3) once for the other two jobs and,
#           on a pull request, enforces the branch rules and a conventional
#           title — Flaiky derives versions from PR titles, so a bad one must
#           never merge.
#   Check   static checks, tests and build in one job on the configured runner.
#           `pipeline / Check` is the single required check-run everywhere; a
#           failed Guard leaves it unreported, which blocks the PR.
#   Deploy  only on a published GitHub release (ADR 0004): a prerelease deploys
#           `preview`, a stable release deploys `production`, via OIDC. Pushes
#           to dev or main never deploy. Flaiky publishes the release.
#
# Callers pin this file by SHA and forward their secrets explicitly — org
# secrets do not cross the owner boundary. Behaviour is configured only through
# the caller's .github/pipeline.yaml. The provider actions are taken from this
# repository at the very same commit: inside a called workflow
# `github.workflow_sha` is the reusable workflow's own SHA.
name: Pipeline

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the pipeline configuration (version 3)
        type: string
        required: false
        default: .github/pipeline.yaml
    secrets:
      CF_ACCESS_CLIENT_ID:
        description: Cloudflare Access service token id for the Infisical host
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
      INFISICAL_CLIENT_ID:
        description: Infisical Universal Auth; OIDC via vars.INFISICAL_IDENTITY_ID is preferred
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      RENDER_DEPLOY_HOOK:
        description: Render deploy hook URL, fired after the production Docker deploy when deploy.render.hook is true
        required: false
      NPM_TOKEN:
        description: Only for packages without npm trusted publishing
        required: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      stack: ${{ steps.config.outputs.stack }}
      node-version: ${{ steps.config.outputs.node-version }}
      package-manager: ${{ steps.config.outputs.package-manager }}
      pnpm-version: ${{ steps.config.outputs.pnpm-version }}
      cache: ${{ steps.config.outputs.cache }}
      python-version: ${{ steps.config.outputs.python-version }}
      runner: ${{ steps.config.outputs.runner }}
      security: ${{ steps.config.outputs.security }}
      trufflehog: ${{ steps.config.outputs.trufflehog }}
      dependency-review: ${{ steps.config.outputs.dependency-review }}
      fail-on-secrets: ${{ steps.config.outputs.fail-on-secrets }}
      fail-on-vulnerabilities: ${{ steps.config.outputs.fail-on-vulnerabilities }}
      lint: ${{ steps.config.outputs.lint }}
      lint-command: ${{ steps.config.outputs.lint-command }}
      test: ${{ steps.config.outputs.test }}
      test-command: ${{ steps.config.outputs.test-command }}
      build: ${{ steps.config.outputs.build }}
      build-command: ${{ steps.config.outputs.build-command }}
      artifact-path: ${{ steps.config.outputs.artifact-path }}
      deploy-provider: ${{ steps.config.outputs.deploy-provider }}
      deploy-targets: ${{ steps.config.outputs.deploy-targets }}
      primary-target: ${{ steps.config.outputs.primary-target }}
      vercel-scope: ${{ steps.config.outputs.vercel-scope }}
      vercel-build-command: ${{ steps.config.outputs.vercel-build-command }}
      cloudflare-config: ${{ steps.config.outputs.cloudflare-config }}
      cloudflare-build-command: ${{ steps.config.outputs.cloudflare-build-command }}
      docker-cache-backend: ${{ steps.config.outputs.docker-cache-backend }}
      render-hook: ${{ steps.config.outputs.render-hook }}
    steps:
      - name: Checkout the configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            ${{ inputs.config-file }}
            package.json
            .nvmrc
            .node-version
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Read pipeline.yaml
        id: config
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          PIPELINE_RUNNER: ${{ vars.PIPELINE_RUNNER }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          multi() { { echo "$1<<PIPELINE_EOF"; printf '%s\n' "$2"; echo "PIPELINE_EOF"; } >> "$GITHUB_OUTPUT"; }
          str() { yq -r "$1 // \"$2\"" "$CONFIG_FILE"; }
          # `//` would turn an explicit `false` into the default; read the raw value instead.
          # bool <output> <yq path> <default> — writes the output itself so a bad value fails the step
          # (an `exit` inside `$(...)` would only kill the subshell).
          bool() {
            local v; v=$(yq -r "$2" "$CONFIG_FILE")
            if [[ "$v" == "null" ]]; then v="$3"; fi
            case "$v" in
              true|false) out "$1" "$v" ;;
              *) echo "::error::$CONFIG_FILE: $2 must be true or false, got '$v'."; exit 1 ;;
            esac
          }

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::No pipeline configuration at $CONFIG_FILE. Every repository on the pipeline carries one."
            exit 1
          fi
          VERSION=$(str '.version' '')
          if [[ "$VERSION" != "3" && "$VERSION" != "3.0" ]]; then
            echo "::error::$CONFIG_FILE is version '${VERSION:-unset}'; this pipeline reads version 3 (deploy: instead of deployment:, no release: block). Run provisioning/migrate-repos.ts."
            exit 1
          fi
          if [[ "$(yq -r 'has("deployment") or has("release") or has("pipeline")' "$CONFIG_FILE")" == "true" ]]; then
            echo "::error::$CONFIG_FILE still has a v2 block (deployment/release/pipeline). Versioning and releases belong to Flaiky; deploys are configured under deploy:."
            exit 1
          fi

          # --- stack and toolchain -------------------------------------------
          STACK=$(str '.stack' 'auto')
          if [[ "$STACK" == "auto" ]]; then
            if [[ -f package.json ]]; then STACK=nodejs
            elif [[ -f pyproject.toml || -f requirements.txt ]]; then STACK=python
            else STACK=none; fi
          fi
          case "$STACK" in nodejs|python|none) ;; *) echo "::error::Unknown stack '$STACK'. Use nodejs, python or none."; exit 1;; esac
          out stack "$STACK"

          NODE_VERSION=$(str '.runtime.node_version' '')
          if [[ -z "$NODE_VERSION" ]]; then
            if [[ -f .nvmrc ]]; then NODE_VERSION=$(tr -d '[:space:]v' < .nvmrc)
            elif [[ -f .node-version ]]; then NODE_VERSION=$(tr -d '[:space:]v' < .node-version)
            elif [[ -f package.json ]]; then NODE_VERSION=$(jq -r '.engines.node // ""' package.json | sed -E 's/^[^0-9]*//; s/[^0-9.].*$//')
            fi
          fi
          out node-version "${NODE_VERSION:-lts/*}"
          out python-version "$(str '.runtime.python_version' '3.12')"

          PM=""; CACHE=""
          if [[ -f pnpm-lock.yaml ]]; then PM=pnpm; CACHE=pnpm
          elif [[ -f yarn.lock ]]; then PM=yarn; CACHE=yarn
          elif [[ -f package-lock.json ]]; then PM=npm; CACHE=npm
          elif [[ -f package.json ]]; then PM=$(jq -r '.packageManager // "npm@"' package.json | cut -d@ -f1)
          fi
          out package-manager "${PM:-npm}"
          out cache "$CACHE"
          PNPM_VERSION=""
          if [[ "$PM" == "pnpm" && "$(jq -r '.packageManager // ""' package.json 2>/dev/null)" != pnpm@* ]]; then PNPM_VERSION=latest; fi
          out pnpm-version "$PNPM_VERSION"

          RUNNER=$(yq -o=json -I=0 '.runner.labels // []' "$CONFIG_FILE" | jq -c '.')
          if [[ "$RUNNER" == "[]" ]]; then
            if [[ -n "${PIPELINE_RUNNER:-}" ]]; then RUNNER=$(jq -c '.' <<< "$PIPELINE_RUNNER"); else RUNNER='["ubuntu-latest"]'; fi
          fi
          out runner "$RUNNER"

          # --- check --------------------------------------------------------------
          bool security '.security.enable' true
          bool trufflehog '.security.trufflehog' true
          bool dependency-review '.security.dependency_review' true
          bool fail-on-secrets '.security.fail_on_secrets' true
          bool fail-on-vulnerabilities '.security.fail_on_vulnerabilities' false
          bool lint '.lint.enable' true
          multi lint-command "$(str '.lint.command' '')"
          bool test '.test.enable' true
          multi test-command "$(str '.test.command' '')"
          bool build '.build.enable' true
          multi build-command "$(str '.build.command' '')"
          out artifact-path "$(str '.build.artifact_path' '')"

          # --- deploy -------------------------------------------------------------
          PROVIDER=$(str '.deploy.provider' 'none')
          case "$PROVIDER" in
            none|vercel|cloudflare-workers|docker-ghcr|npm) ;;
            *) echo "::error::Unknown deploy provider '$PROVIDER'. Supported: none, vercel, cloudflare-workers, docker-ghcr, npm."; exit 1;;
          esac
          out deploy-provider "$PROVIDER"
          if [[ "$PROVIDER" == "docker-ghcr" ]]; then
            TARGETS=$(yq -o=json -I=0 '.deploy.docker.images // []' "$CONFIG_FILE" | jq -c '.')
            if [[ "$TARGETS" == "[]" ]]; then echo "::error::deploy.provider is docker-ghcr but deploy.docker.images is empty."; exit 1; fi
          else
            TARGETS='[{"name":"app"}]'
          fi
          out deploy-targets "$TARGETS"
          out primary-target "$(jq -r '.[0].name' <<< "$TARGETS")"
          out vercel-scope "$(str '.deploy.vercel.scope' '')"
          multi vercel-build-command "$(str '.deploy.vercel.build_command' '')"
          out cloudflare-config "$(str '.deploy.cloudflare.config' 'wrangler.toml')"
          multi cloudflare-build-command "$(str '.deploy.cloudflare.build_command' '')"
          out docker-cache-backend "$(str '.deploy.docker.cache_backend' 'gha')"
          bool render-hook '.deploy.render.hook' false
          echo "stack=$STACK runner=$RUNNER provider=$PROVIDER targets=$TARGETS"

      - name: Does this repository have a dev branch?
        id: dev
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/branches/dev" --jq '.name' >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Branch and title rules
        id: rules
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DEV_EXISTS: ${{ steps.dev.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME:-}" != "pull_request" ]]; then
            echo "Not a pull request; nothing to guard."
            exit 0
          fi
          # Conventional commit subject: type, optional scope, optional breaking bang.
          # Squash merge makes this the commit subject Flaiky reads for the version (D45).
          TITLE_RE='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: [^ ].*$'
          if [[ ! "$PR_TITLE" =~ $TITLE_RE ]]; then
            echo "::error::PR title '$PR_TITLE' is not a conventional commit subject (type(scope)!: summary). Versions are derived from PR titles, so this cannot merge."
            exit 1
          fi
          if [[ "$PR_BASE" == "main" ]]; then
            if [[ "$PR_HEAD_REPO" != "$BASE_REPO" ]]; then
              echo "::error::Fork pull requests cannot target main."
              exit 1
            fi
            if [[ "$DEV_EXISTS" == "true" ]]; then
              case "$PR_HEAD" in
                dev|promote/*|hotfix/*|release/*) ;;
                *)
                  echo "::error::PRs into main must come from dev, promote/*, hotfix/* or release/* — feature work targets dev."
                  exit 1
                  ;;
              esac
            fi
          fi
          echo "✅ '$PR_TITLE' from $PR_HEAD into $PR_BASE is allowed"

  check:
    name: Check
    needs: guard
    if: github.event_name != 'release'
    runs-on: ${{ fromJSON(needs.guard.outputs.runner) }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: write # trunk posts lint annotations through the Checks API
      id-token: write # Infisical OIDC for build-time secrets
    env:
      STACK: ${{ needs.guard.outputs.stack }}
      PM: ${{ needs.guard.outputs.package-manager }}
    steps:
      # /tmp is noexec on the hardened rootless homelab runners; tooling that
      # mktemp+execs (esbuild, swc, native modules) needs an exec-capable tmp.
      # No-op on GitHub-hosted runners.
      - name: Route tmp to the runner workdir
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # trufflehog scans the commit range

      # TruffleHog runs as the pinned binary, not the container action: the
      # homelab runners are rootless with no Docker socket.
      - name: Secret scan
        if: needs.guard.outputs.security == 'true' && needs.guard.outputs.trufflehog == 'true'
        shell: bash
        env:
          TRUFFLEHOG_VERSION: v3.93.4
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FAIL_ON_SECRETS: ${{ needs.guard.outputs.fail-on-secrets }}
        run: |
          set -euo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000
          BIN_DIR="${RUNNER_TEMP}/trufflehog-bin"
          mkdir -p "$BIN_DIR"
          curl -sSfL "https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh" \
            | sh -s -- -b "$BIN_DIR" "${TRUFFLEHOG_VERSION}"
          ARGS=(git "file://${GITHUB_WORKSPACE}" --no-update --fail --only-verified)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ARGS+=(--since-commit "$PR_BASE_SHA" --branch "$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" && ( "$PUSH_BEFORE" == "$COMMIT_SHA" || "$PUSH_BEFORE" == "$ZERO_SHA" ) ]]; then
            ARGS+=(--since-commit "HEAD~10")
          else
            ARGS+=(--since-commit "$PUSH_BEFORE" --branch "$COMMIT_SHA")
          fi
          set +e
          "$BIN_DIR/trufflehog" "${ARGS[@]}"
          CODE=$?
          set -e
          if [[ "$CODE" -eq 0 ]]; then echo "✅ No verified secrets"; exit 0; fi
          if [[ "$CODE" -eq 183 ]]; then
            if [[ "$FAIL_ON_SECRETS" == "true" ]]; then echo "::error::TruffleHog found verified secrets. Remove them and rotate."; exit 1; fi
            echo "::warning::TruffleHog found verified secrets (fail_on_secrets is off)."; exit 0
          fi
          echo "::error::TruffleHog exited $CODE"; exit "$CODE"

      # The dependency graph API needs a public repository or GHAS; private
      # repositories without it get a notice instead of a red Check.
      - name: Dependency review
        if: |
          needs.guard.outputs.security == 'true' && needs.guard.outputs.dependency-review == 'true' &&
          github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@9129d7d40b8c12c1ed0f60400d00c92d437adcce # v4.1.3
        with:
          fail-on-severity: ${{ needs.guard.outputs.fail-on-vulnerabilities == 'true' && 'moderate' || 'critical' }}
          warn-only: ${{ needs.guard.outputs.fail-on-vulnerabilities != 'true' }}
          comment-summary-in-pr: never
      - name: Dependency review unavailable
        if: |
          needs.guard.outputs.security == 'true' && needs.guard.outputs.dependency-review == 'true' &&
          github.event_name == 'pull_request' && github.event.repository.private == true
        shell: bash
        run: echo "::notice::Dependency review needs a public repository or GitHub Advanced Security; skipped."

      - name: Set up pnpm (from packageManager)
        if: env.STACK == 'nodejs' && env.PM == 'pnpm' && needs.guard.outputs.pnpm-version == ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up pnpm (latest)
        if: env.STACK == 'nodejs' && env.PM == 'pnpm' && needs.guard.outputs.pnpm-version != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ needs.guard.outputs.pnpm-version }}
      - name: Set up Node.js
        if: env.STACK == 'nodejs'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ needs.guard.outputs.node-version }}
          cache: ${{ needs.guard.outputs.cache }}
      - name: Set up Python
        if: env.STACK == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.guard.outputs.python-version }}

      - name: Install dependencies
        if: env.STACK != 'none'
        shell: bash
        run: |
          set -euo pipefail
          case "$STACK" in
            nodejs)
              case "$PM" in
                pnpm) pnpm install --frozen-lockfile ;;
                yarn) yarn install --frozen-lockfile ;;
                npm) if [[ -f package-lock.json ]]; then npm ci; else npm install; fi ;;
                *) echo "::error::Unknown package manager '$PM'"; exit 1 ;;
              esac ;;
            python)
              python -m pip install --upgrade pip
              if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
              if [[ -f requirements-dev.txt ]]; then pip install -r requirements-dev.txt; fi
              if [[ -f pyproject.toml && ! -f requirements.txt ]]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi ;;
          esac

      - name: Which linter?
        id: linter
        if: needs.guard.outputs.lint == 'true'
        shell: bash
        env:
          LINT_COMMAND: ${{ needs.guard.outputs.lint-command }}
        run: |
          set -euo pipefail
          if [[ -z "$LINT_COMMAND" && -f .trunk/trunk.yaml ]]; then echo "trunk=true" >> "$GITHUB_OUTPUT"; else echo "trunk=false" >> "$GITHUB_OUTPUT"; fi
      - name: Lint (trunk)
        if: needs.guard.outputs.lint == 'true' && steps.linter.outputs.trunk == 'true'
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
      - name: Lint
        if: needs.guard.outputs.lint == 'true' && steps.linter.outputs.trunk != 'true'
        shell: bash
        env:
          LINT_COMMAND: ${{ needs.guard.outputs.lint-command }}
        run: |
          set -euo pipefail
          if [[ -n "$LINT_COMMAND" ]]; then bash -eo pipefail -c "$LINT_COMMAND"
          elif [[ "$STACK" == "nodejs" ]] && jq -e '.scripts.lint' package.json >/dev/null; then "$PM" run lint
          elif [[ "$STACK" == "python" ]] && command -v ruff >/dev/null; then ruff check .
          else echo "::notice::No lint command configured and none detected; skipped."; fi

      - name: Test
        if: needs.guard.outputs.test == 'true'
        shell: bash
        env:
          TEST_COMMAND: ${{ needs.guard.outputs.test-command }}
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ -n "$TEST_COMMAND" ]]; then bash -eo pipefail -c "$TEST_COMMAND"
          elif [[ "$STACK" == "nodejs" ]] && jq -e '.scripts.test' package.json >/dev/null; then "$PM" test
          elif [[ "$STACK" == "python" ]] && [[ -d tests ]]; then python -m pytest
          else echo "::notice::No test command configured and none detected; skipped."; fi

      # Build-time secrets come from Infisical's preview environment (CI never
      # reads production). A transient Infisical outage or an Access gate must
      # not hard-fail a compile-only build: probe first, skip with a warning.
      - name: Infisical for the build
        id: infisical
        if: needs.guard.outputs.build == 'true'
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'preview' }}
          INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
        run: |
          set -euo pipefail
          if [[ -z "$INFISICAL_PROJECT_SLUG" ]]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "No vars.INFISICAL_PROJECT_SLUG; building without Infisical secrets."; exit 0; fi
          if [[ -n "$INFISICAL_IDENTITY_ID" ]]; then method=oidc
          elif [[ -n "$INFISICAL_CLIENT_ID" && -n "$INFISICAL_CLIENT_SECRET" ]]; then method=universal
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::Infisical auth incomplete; building without secrets."; exit 0; fi
          probe="$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --connect-timeout 5 --max-time 10 "${INFISICAL_DOMAIN%/}/api/status" 2>/dev/null || true)"
          code="${probe%% *}"; type="${probe#* }"
          if [[ "$code" =~ ^2[0-9][0-9]$ && "$type" == application/json* ]]; then
            { echo "enabled=true"; echo "method=$method"; echo "env-slug=$INFISICAL_ENV_SLUG"; } >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Infisical at $INFISICAL_DOMAIN answered '${code:-000} ${type:-none}' (an Access redirect or an outage); building without secrets."
          fi
      - name: Load Infisical secrets (OIDC)
        if: steps.infisical.outputs.enabled == 'true' && steps.infisical.outputs.method == 'oidc'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ steps.infisical.outputs.env-slug }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Load Infisical secrets (Universal Auth)
        if: steps.infisical.outputs.enabled == 'true' && steps.infisical.outputs.method == 'universal'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ steps.infisical.outputs.env-slug }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Build
        if: needs.guard.outputs.build == 'true'
        shell: bash
        env:
          BUILD_COMMAND: ${{ needs.guard.outputs.build-command }}
          APP_ENV: preview
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_COMMAND" ]]; then bash -eo pipefail -c "$BUILD_COMMAND"
          elif [[ "$STACK" == "nodejs" ]] && jq -e '.scripts.build' package.json >/dev/null; then "$PM" run build
          else echo "::notice::No build command configured and none detected; skipped."; fi
      - name: Upload build artifact
        if: needs.guard.outputs.build == 'true' && needs.guard.outputs.artifact-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ github.sha }}
          path: ${{ needs.guard.outputs.artifact-path }}
          retention-days: 7

  deploy:
    name: Deploy${{ matrix.target.name != 'app' && format(' / {0}', matrix.target.name) || '' }}
    needs: guard
    if: github.event_name == 'release' && github.event.action == 'published' && needs.guard.outputs.deploy-provider != 'none'
    runs-on: ${{ fromJSON(needs.guard.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      packages: write # ghcr
      id-token: write # OIDC: Infisical, npm trusted publishing
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.guard.outputs.deploy-targets) }}
    environment:
      name: ${{ github.event.release.prerelease && 'preview' || 'production' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event.release.prerelease && 'preview' || 'production' }}
      PROVIDER: ${{ needs.guard.outputs.deploy-provider }}
    steps:
      - name: Route tmp to the runner workdir
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The provider actions, at exactly the commit this workflow was pinned to.
      - name: Checkout the pipeline's actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maxbec/pipeline
          ref: ${{ github.workflow_sha }}
          path: .pipeline
          sparse-checkout: .github/actions

      - name: Release version
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG to $DEPLOY_ENVIRONMENT"

      - name: Set up pnpm (from packageManager)
        if: env.PROVIDER != 'docker-ghcr' && needs.guard.outputs.package-manager == 'pnpm' && needs.guard.outputs.pnpm-version == ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up pnpm (latest)
        if: env.PROVIDER != 'docker-ghcr' && needs.guard.outputs.package-manager == 'pnpm' && needs.guard.outputs.pnpm-version != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ needs.guard.outputs.pnpm-version }}
      - name: Set up Node.js
        if: env.PROVIDER != 'docker-ghcr'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ needs.guard.outputs.node-version }}
          cache: ${{ needs.guard.outputs.cache }}
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        if: env.PROVIDER == 'cloudflare-workers' || env.PROVIDER == 'npm'
        shell: bash
        env:
          PM: ${{ needs.guard.outputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) if [[ -f package-lock.json ]]; then npm ci; else npm install; fi ;;
          esac

      # Deploys read the environment they deploy: preview or production. Strict:
      # a deploy that cannot read its secrets fails instead of shipping blind.
      - name: Infisical for the deploy
        id: infisical
        if: env.PROVIDER == 'vercel' || env.PROVIDER == 'cloudflare-workers'
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_PROD_ENV_SLUG: ${{ vars.INFISICAL_PROD_ENV_SLUG || 'production' }}
          INFISICAL_PREVIEW_ENV_SLUG: ${{ vars.INFISICAL_PREVIEW_ENV_SLUG || 'preview' }}
        run: |
          set -euo pipefail
          if [[ -z "$INFISICAL_PROJECT_SLUG" ]]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$DEPLOY_ENVIRONMENT" == "production" ]]; then slug="$INFISICAL_PROD_ENV_SLUG"; else slug="$INFISICAL_PREVIEW_ENV_SLUG"; fi
          if [[ -n "$INFISICAL_IDENTITY_ID" ]]; then method=oidc
          elif [[ -n "$INFISICAL_CLIENT_ID" && -n "$INFISICAL_CLIENT_SECRET" ]]; then method=universal
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "enabled=true"; echo "method=$method"; echo "env-slug=$slug"; } >> "$GITHUB_OUTPUT"
      - name: Load Infisical secrets (OIDC)
        if: steps.infisical.outputs.enabled == 'true' && steps.infisical.outputs.method == 'oidc'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ steps.infisical.outputs.env-slug }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Load Infisical secrets (Universal Auth)
        if: steps.infisical.outputs.enabled == 'true' && steps.infisical.outputs.method == 'universal'
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ steps.infisical.outputs.env-slug }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          secret-path: ${{ vars.INFISICAL_SECRET_PATH || '/' }}
          extra-headers: |
            CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Deploy to Vercel
        if: env.PROVIDER == 'vercel'
        uses: ./.pipeline/.github/actions/deploy-vercel
        env:
          APP_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-scope: ${{ needs.guard.outputs.vercel-scope }}
          environment: ${{ env.DEPLOY_ENVIRONMENT }}
          github-token: ${{ github.token }}
          build-command: ${{ needs.guard.outputs.vercel-build-command }}

      - name: Deploy to Cloudflare Workers
        if: env.PROVIDER == 'cloudflare-workers'
        uses: ./.pipeline/.github/actions/deploy-cloudflare
        env:
          APP_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ env.DEPLOY_ENVIRONMENT }}
          build-command: ${{ needs.guard.outputs.cloudflare-build-command }}
          wrangler-config: ${{ needs.guard.outputs.cloudflare-config }}
          github-token: ${{ github.token }}

      - name: Image metadata
        id: meta
        if: env.PROVIDER == 'docker-ghcr'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          IMAGE_SUFFIX: ${{ matrix.target.name }}
          IMAGE_NAME_OVERRIDE: ${{ matrix.target.image_name }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EXTRA_BUILD_ARGS: ${{ matrix.target.build_args }}
        run: |
          set -euo pipefail
          REPO_LOWER="${REPO,,}"
          if [[ -n "$IMAGE_NAME_OVERRIDE" ]]; then NAME="$IMAGE_NAME_OVERRIDE"
          elif [[ -n "$IMAGE_SUFFIX" && "$IMAGE_SUFFIX" != "default" && "$IMAGE_SUFFIX" != "app" ]]; then NAME="${REPO_LOWER}-${IMAGE_SUFFIX}"
          else NAME="$REPO_LOWER"; fi
          # A stable release moves :latest (what production stacks pull); a
          # prerelease moves :dev (what the preview stack pulls). Both keep :<version>.
          if [[ "$PRERELEASE" == "true" ]]; then CHANNEL=dev; else CHANNEL=latest; fi
          BUILD_ARGS="APP_VERSION=${VERSION}"
          if [[ -n "$EXTRA_BUILD_ARGS" ]]; then BUILD_ARGS+=$'\n'"$EXTRA_BUILD_ARGS"; fi
          {
            echo "image-name=$NAME"
            echo "image-tag=$VERSION"
            echo "version-tag=$CHANNEL"
            echo "build-args<<PIPELINE_EOF"; printf '%s\n' "$BUILD_ARGS"; echo "PIPELINE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        if: env.PROVIDER == 'docker-ghcr'
        uses: ./.pipeline/.github/actions/deploy-docker
        with:
          dockerfile: ${{ matrix.target.dockerfile || 'Dockerfile' }}
          context: ${{ matrix.target.context || '.' }}
          image-name: ${{ steps.meta.outputs.image-name }}
          image-tag: ${{ steps.meta.outputs.image-tag }}
          version-tag: ${{ steps.meta.outputs.version-tag }}
          registry: ghcr
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          build-args: ${{ steps.meta.outputs.build-args }}
          platforms: ${{ matrix.target.platforms || 'linux/amd64' }}
          cache-backend: ${{ needs.guard.outputs.docker-cache-backend }}
          cache-scope: ${{ matrix.target.name }}
      # Watchtower on the host polls the registry; nothing to trigger here.
      - name: Render deploy hook
        if: |
          env.PROVIDER == 'docker-ghcr' && needs.guard.outputs.render-hook == 'true' &&
          env.DEPLOY_ENVIRONMENT == 'production' && matrix.target.name == needs.guard.outputs.primary-target
        uses: ./.pipeline/.github/actions/deploy-render
        with:
          deploy-hook-url: ${{ secrets.RENDER_DEPLOY_HOOK }}
          environment: production
          service-name: ${{ github.event.repository.name }}
          github-token: ${{ github.token }}

      # Trusted publishing: npm mints provenance from the OIDC token; NPM_TOKEN
      # is only for packages that have not been switched over yet.
      - name: Publish to npm
        if: env.PROVIDER == 'npm'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PM: ${{ needs.guard.outputs.package-manager }}
          BUILD_COMMAND: ${{ needs.guard.outputs.build-command }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILD_COMMAND" ]]; then bash -eo pipefail -c "$BUILD_COMMAND"
          elif jq -e '.scripts.build' package.json >/dev/null; then "$PM" run build; fi
          TAG_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then TAG_ARGS=(--tag next); fi
          npm publish --access public "${TAG_ARGS[@]}"
