---
# The universal pipeline, slim (Flaiky Phase 10, D34 / D42). Three jobs, and
# a fourth that most runs never start:
#
#   Guard   parses .github/pipeline.yaml (v3) once for the other two jobs and,
#           on a pull request, enforces the branch rules and a conventional
#           title — Flaiky derives versions from PR titles, so a bad one must
#           never merge.
#   Check   static checks, tests and build in one job on the configured runner.
#           `pipeline / Check` is the single required check-run everywhere; a
#           failed Guard leaves it unreported, which blocks the PR.
#   Deploy  only on a published GitHub release (ADR 0004): a prerelease deploys
#           `preview`, a stable release deploys `production`, via OIDC. Pushes
#           to dev or main never deploy. Flaiky publishes the release.
#
#   Recheck Release PR
#           only after a green full Check on a dispatch or a schedule, in a
#           repository that sets test.pr_command: re-runs the Pipeline run of
#           the Release PR that waited for that Check. Skipped everywhere else.
#
# Callers pin this file by SHA and forward their secrets explicitly — org
# secrets do not cross the owner boundary. Behaviour is configured only through
# the caller's .github/pipeline.yaml. The provider actions are taken from this
# repository at the very same commit: inside a called workflow
# `job.workflow_sha` is the reusable workflow's own commit. `github.workflow_sha`
# is the caller's — measured 2026-10-08, when the first release deploy on v5.0.1
# fetched maxbec/pipeline at the caller's SHA and died with "not our ref".
name: Pipeline

on:
  workflow_call:
    inputs:
      config-file:
        description: Path to the pipeline configuration (version 3)
        type: string
        required: false
        default: .github/pipeline.yaml
    secrets:
      # Unused. The pipeline no longer reads Infisical: every credential arrives
      # as a GitHub secret, pushed there by Infisical's Secret Sync. These four
      # stay declared for one release so that a caller which still forwards
      # them does not fail to start; the release after removes them.
      CF_ACCESS_CLIENT_ID:
        description: Unused, declared for one more release
        required: false
      CF_ACCESS_CLIENT_SECRET:
        description: Unused, declared for one more release
        required: false
      INFISICAL_CLIENT_ID:
        description: Unused, declared for one more release
        required: false
      INFISICAL_CLIENT_SECRET:
        description: Unused, declared for one more release
        required: false
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      RENDER_DEPLOY_HOOK:
        description: Render deploy hook URL, fired after the production Docker deploy when deploy.render.hook is true
        required: false
      NPM_TOKEN:
        description: Only for packages without npm trusted publishing
        required: false

jobs:
  guard:
    name: Guard
    # The one-core container runner: Guard reads a few files and asks the API,
    # with bash, yq, jq, gh, git and python3, all of which that image carries.
    # It has no Docker and a 15-minute limit, neither of which Guard comes near.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read # the reuse steps look up earlier runs and their tree markers
    outputs:
      stack: ${{ steps.config.outputs.stack }}
      node-version: ${{ steps.config.outputs.node-version }}
      package-manager: ${{ steps.config.outputs.package-manager }}
      pnpm-version: ${{ steps.config.outputs.pnpm-version }}
      cache: ${{ steps.config.outputs.cache }}
      dependency-cache: ${{ steps.config.outputs.dependency-cache }}
      build-cache: ${{ steps.config.outputs.build-cache }}
      python-version: ${{ steps.config.outputs.python-version }}
      runner: ${{ steps.config.outputs.runner }}
      security: ${{ steps.config.outputs.security }}
      trufflehog: ${{ steps.config.outputs.trufflehog }}
      dependency-review: ${{ steps.config.outputs.dependency-review }}
      fail-on-secrets: ${{ steps.config.outputs.fail-on-secrets }}
      fail-on-vulnerabilities: ${{ steps.config.outputs.fail-on-vulnerabilities }}
      lint: ${{ steps.config.outputs.lint }}
      lint-command-b64: ${{ steps.config.outputs.lint-command-b64 }}
      test: ${{ steps.config.outputs.test }}
      test-command-b64: ${{ steps.config.outputs.test-command-b64 }}
      test-pr-command-b64: ${{ steps.config.outputs.test-pr-command-b64 }}
      # test.pr_command is set: this repository runs two depths of Check. Fast
      # (lint, the pr_command, build) on pull requests and pushes, full (lint,
      # test.command, build) on a dispatch, a schedule, a hotfix and wherever a
      # Release PR has to be checked itself. Without it everything is full.
      fast-mode: ${{ steps.config.outputs.fast-mode }}
      depth: ${{ steps.depth.outputs.depth }}
      test-artifact-path: ${{ steps.config.outputs.test-artifact-path }}
      build: ${{ steps.config.outputs.build }}
      build-command-b64: ${{ steps.config.outputs.build-command-b64 }}
      artifact-path: ${{ steps.config.outputs.artifact-path }}
      deploy-provider: ${{ steps.config.outputs.deploy-provider }}
      deploy-targets: ${{ steps.config.outputs.deploy-targets }}
      primary-target: ${{ steps.config.outputs.primary-target }}
      vercel-scope: ${{ steps.config.outputs.vercel-scope }}
      vercel-preview-alias: ${{ steps.config.outputs.vercel-preview-alias }}
      vercel-build-command-b64: ${{ steps.config.outputs.vercel-build-command-b64 }}
      cloudflare-config: ${{ steps.config.outputs.cloudflare-config }}
      cloudflare-build-command-b64: ${{ steps.config.outputs.cloudflare-build-command-b64 }}
      docker-cache-backend: ${{ steps.config.outputs.docker-cache-backend }}
      render-hook: ${{ steps.config.outputs.render-hook }}
      reuse: ${{ steps.tree.outputs.reuse == 'true' || steps.reuse.outputs.reuse == 'true' }}
      reuse-note: ${{ steps.tree.outputs.reuse == 'true' && steps.tree.outputs.note || steps.reuse.outputs.note }}
      # Fast mode only: a Release PR whose base tip has not passed the full
      # Check. Check fails at once and runs nothing; it is never a reuse.
      unverified: ${{ steps.reuse.outputs.unverified }}
      unverified-note: ${{ steps.reuse.outputs.unverified-note }}
      tree: ${{ steps.tree.outputs.tree }}
      # The artifact name a green Check leaves for its tree, without the tree:
      # pipeline-checked-tree after a full Check, pipeline-fast-tree after a
      # fast one.
      marker: ${{ steps.marker.outputs.name }}
      # A reused Check needs no tooling, and one that only reports "not fully
      # verified" needs none either, so neither takes the configured runner:
      # the one-core runner Guard uses is enough.
      check-runner: ${{ (steps.tree.outputs.reuse == 'true' || steps.reuse.outputs.reuse == 'true' || steps.reuse.outputs.unverified == 'true') && '["ubuntu-slim"]' || steps.config.outputs.runner }}
    steps:
      - name: Checkout the configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            ${{ inputs.config-file }}
            package.json
            .nvmrc
            .node-version
            pnpm-lock.yaml
            yarn.lock
            package-lock.json
            pyproject.toml
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Read pipeline.yaml
        id: config
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          PIPELINE_RUNNER: ${{ vars.PIPELINE_RUNNER }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # Command strings leave this job base64-encoded. GitHub scans job
          # outputs and silently drops any value it believes holds a credential
          # ("Skip output 'build-command' since it may contain secret"), which
          # is how maxbec/crewdo#137 reached Check with an empty BUILD_COMMAND
          # and built with the fallback instead. Consumers decode with base64 -d.
          b64() { out "$1-b64" "$(printf '%s' "$2" | base64 -w0)"; }
          str() { yq -r "$1 // \"$2\"" "$CONFIG_FILE"; }
          # `//` would turn an explicit `false` into the default; read the raw value instead.
          # bool <output> <yq path> <default> — writes the output itself so a bad value fails the step
          # (an `exit` inside `$(...)` would only kill the subshell).
          bool() {
            local v; v=$(yq -r "$2" "$CONFIG_FILE")
            if [[ "$v" == "null" ]]; then v="$3"; fi
            case "$v" in
              true|false) out "$1" "$v" ;;
              *) echo "::error::$CONFIG_FILE: $2 must be true or false, got '$v'."; exit 1 ;;
            esac
          }

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::No pipeline configuration at $CONFIG_FILE. Every repository on the pipeline carries one."
            exit 1
          fi
          VERSION=$(str '.version' '')
          if [[ "$VERSION" != "3" && "$VERSION" != "3.0" ]]; then
            echo "::error::$CONFIG_FILE is version '${VERSION:-unset}'; this pipeline reads version 3 (deploy: instead of deployment:). Run provisioning/migrate-repos.ts."
            exit 1
          fi
          for KEY in deployment pipeline; do
            if [[ "$(KEY="$KEY" yq -r 'has(strenv(KEY))' "$CONFIG_FILE")" == "true" ]]; then
              echo "::error::$CONFIG_FILE still has the v2 block $KEY:. Deploys are configured under deploy:; pipeline: is no longer read."
              exit 1
            fi
          done

          # --- release (read by the Train workflow, only validated here) ------
          # A typo in this block would otherwise surface as a release with the
          # wrong version files, long after the pull request that made it.
          bad() { echo "::error::$CONFIG_FILE: $1"; exit 1; }
          case "$(yq -r '.release | tag' "$CONFIG_FILE")" in
            '!!null') ;;
            '!!map')
              while IFS= read -r KEY; do
                case "$KEY" in
                  version_files)
                    # An empty list is a choice, not a mistake: the repository
                    # carries no version file and releases with the tag and
                    # the CHANGELOG only. The train reads it the same way.
                    [[ "$(yq -r '.release.version_files | tag' "$CONFIG_FILE")" == '!!seq' ]] \
                      || bad "release.version_files must be a list of paths."
                    [[ "$(yq -r '.release.version_files | all_c(tag == "!!str" and . != "")' "$CONFIG_FILE")" == "true" ]] \
                      || bad "release.version_files must be a list of paths; every entry a non-empty string."
                    ;;
                  changelog_show_hidden)
                    [[ "$(yq -r '.release.changelog_show_hidden | tag' "$CONFIG_FILE")" == '!!bool' ]] \
                      || bad "release.changelog_show_hidden must be true or false."
                    ;;
                  release_as)
                    [[ "$(yq -r '.release.release_as | tag' "$CONFIG_FILE")" == '!!str' \
                      && "$(yq -r '.release.release_as' "$CONFIG_FILE")" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
                      || bad "release.release_as must be a version X.Y.Z (quote it: '2.0' alone is a number)."
                    ;;
                  *) bad "release.$KEY is not a known key. Known: version_files, changelog_show_hidden, release_as." ;;
                esac
              done < <(yq -r '.release | keys | .[]' "$CONFIG_FILE")
              ;;
            *) bad "release must be a mapping with version_files, changelog_show_hidden and release_as." ;;
          esac

          # --- stack and toolchain -------------------------------------------
          STACK=$(str '.stack' 'auto')
          if [[ "$STACK" == "auto" ]]; then
            if [[ -f package.json ]]; then STACK=nodejs
            elif [[ -f pyproject.toml || -f requirements.txt ]]; then STACK=python
            else STACK=none; fi
          fi
          case "$STACK" in nodejs|python|none) ;; *) echo "::error::Unknown stack '$STACK'. Use nodejs, python or none."; exit 1;; esac
          out stack "$STACK"

          NODE_VERSION=$(str '.runtime.node_version' '')
          if [[ -z "$NODE_VERSION" ]]; then
            if [[ -f .nvmrc ]]; then NODE_VERSION=$(tr -d '[:space:]v' < .nvmrc)
            elif [[ -f .node-version ]]; then NODE_VERSION=$(tr -d '[:space:]v' < .node-version)
            elif [[ -f package.json ]]; then NODE_VERSION=$(jq -r '.engines.node // ""' package.json | sed -E 's/^[^0-9]*//; s/[^0-9.].*$//')
            fi
          fi
          out node-version "${NODE_VERSION:-lts/*}"
          out python-version "$(str '.runtime.python_version' '3.12')"

          PM=""; CACHE=""
          if [[ -f pnpm-lock.yaml ]]; then PM=pnpm; CACHE=pnpm
          elif [[ -f yarn.lock ]]; then PM=yarn; CACHE=yarn
          elif [[ -f package-lock.json ]]; then PM=npm; CACHE=npm
          elif [[ -f package.json ]]; then PM=$(jq -r '.packageManager // "npm@"' package.json | cut -d@ -f1)
          fi
          out package-manager "${PM:-npm}"
          RUNNER=$(yq -o=json -I=0 '.runner.labels // []' "$CONFIG_FILE" | jq -c '.')
          if [[ "$RUNNER" == "[]" ]]; then
            if [[ -n "${PIPELINE_RUNNER:-}" ]]; then RUNNER=$(jq -c '.' <<< "$PIPELINE_RUNNER"); else RUNNER='["ubuntu-latest"]'; fi
          fi
          out runner "$RUNNER"

          # A self-hosted runner whose package store survives between jobs gains
          # nothing from restoring the cache over it: crewsy's runners keep 2.2 GB
          # under /_work and still pulled 640 MB per Check, 40 to 80 seconds. Saving
          # is worse: a homelab uplink took 20 minutes to upload 0.7 GB of trunk
          # cache and 3.4 GB of npm cache after three minutes of work (dispoplaner,
          # 2026-11-12), and a pull request never finds the cache of its base
          # branch, because the push run there reuses the checked tree and saves
          # none. So the cache is off on a self-hosted runner unless the
          # repository asks for it.
          DEPENDENCY_CACHE=$(yq -r '.runtime.dependency_cache' "$CONFIG_FILE")
          case "$DEPENDENCY_CACHE" in
            null) if jq -e 'index("self-hosted") != null' <<< "$RUNNER" >/dev/null; then DEPENDENCY_CACHE=false; else DEPENDENCY_CACHE=true; fi ;;
            true|false) ;;
            *) echo "::error::$CONFIG_FILE: .runtime.dependency_cache must be true or false, got '$DEPENDENCY_CACHE'."; exit 1 ;;
          esac
          if [[ "$DEPENDENCY_CACHE" == "false" ]]; then CACHE=""; fi
          out cache "$CACHE"
          out dependency-cache "$DEPENDENCY_CACHE"
          # runtime.build_cache: one directory (PIPELINE_BUILD_CACHE_DIR) that a
          # task runner such as turbo keeps its results in, restored on every
          # Check and saved by pushes only. What goes in it, and proving that a
          # replayed result is safe, is the repository's business. It follows
          # the dependency cache: a runner whose disk outlives the job keeps its
          # own.
          BUILD_CACHE=$(yq -r '.runtime.build_cache' "$CONFIG_FILE")
          case "$BUILD_CACHE" in
            null) BUILD_CACHE=false ;;
            true|false) ;;
            *) echo "::error::$CONFIG_FILE: .runtime.build_cache must be true or false, got '$BUILD_CACHE'."; exit 1 ;;
          esac
          if [[ "$DEPENDENCY_CACHE" == "false" ]]; then BUILD_CACHE=false; fi
          out build-cache "$BUILD_CACHE"
          # pnpm/action-setup reads a pin from devEngines.packageManager first, then packageManager;
          # ask for the latest pnpm only when the manifest pins neither.
          PNPM_VERSION=""
          if [[ "$PM" == "pnpm" ]] && ! jq -e '(.packageManager // "" | tostring | startswith("pnpm@"))
              or (.devEngines.packageManager | type == "object" and .name == "pnpm" and (.version // "") != "")' \
              package.json >/dev/null 2>&1; then PNPM_VERSION=latest; fi
          out pnpm-version "$PNPM_VERSION"

          # --- check --------------------------------------------------------------
          bool security '.security.enable' true
          bool trufflehog '.security.trufflehog' true
          bool dependency-review '.security.dependency_review' true
          bool fail-on-secrets '.security.fail_on_secrets' true
          bool fail-on-vulnerabilities '.security.fail_on_vulnerabilities' false
          bool lint '.lint.enable' true
          b64 lint-command "$(str '.lint.command' '')"
          bool test '.test.enable' true
          b64 test-command "$(str '.test.command' '')"
          # test.pr_command: what a fast Check runs instead of test.command.
          # Setting it is the switch for the two depths ("How deep does this
          # Check go?"); a repository without it is checked in full every time.
          case "$(yq -r '.test.pr_command | tag' "$CONFIG_FILE")" in
            '!!null'|'!!str') ;;
            *) bad "test.pr_command must be a string: the command a fast Check runs instead of test.command." ;;
          esac
          PR_COMMAND=$(str '.test.pr_command' '')
          if [[ ! "$PR_COMMAND" =~ [^[:space:]] ]]; then PR_COMMAND=""; fi
          b64 test-pr-command "$PR_COMMAND"
          if [[ -n "$PR_COMMAND" ]]; then out fast-mode true; else out fast-mode false; fi
          out test-artifact-path "$(str '.test.artifact_path' '')"
          bool build '.build.enable' true
          b64 build-command "$(str '.build.command' '')"
          out artifact-path "$(str '.build.artifact_path' '')"

          # --- deploy -------------------------------------------------------------
          PROVIDER=$(str '.deploy.provider' 'none')
          case "$PROVIDER" in
            none|vercel|cloudflare-workers|docker-ghcr|npm) ;;
            *) echo "::error::Unknown deploy provider '$PROVIDER'. Supported: none, vercel, cloudflare-workers, docker-ghcr, npm."; exit 1;;
          esac
          out deploy-provider "$PROVIDER"
          if [[ "$PROVIDER" == "docker-ghcr" ]]; then
            TARGETS=$(yq -o=json -I=0 '.deploy.docker.images // []' "$CONFIG_FILE" | jq -c '.')
            if [[ "$TARGETS" == "[]" ]]; then echo "::error::deploy.provider is docker-ghcr but deploy.docker.images is empty."; exit 1; fi
          else
            TARGETS='[{"name":"app"}]'
          fi
          out deploy-targets "$TARGETS"
          out primary-target "$(jq -r '.[0].name' <<< "$TARGETS")"
          out vercel-scope "$(str '.deploy.vercel.scope' '')"
          PREVIEW_ALIAS=$(str '.deploy.vercel.preview_alias' '')
          if [[ -n "$PREVIEW_ALIAS" && ! "$PREVIEW_ALIAS" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$ ]]; then
            echo "::error::deploy.vercel.preview_alias '$PREVIEW_ALIAS' is not a hostname (e.g. my-app-dev.vercel.app)."; exit 1
          fi
          out vercel-preview-alias "$PREVIEW_ALIAS"
          b64 vercel-build-command "$(str '.deploy.vercel.build_command' '')"
          out cloudflare-config "$(str '.deploy.cloudflare.config' 'wrangler.toml')"
          b64 cloudflare-build-command "$(str '.deploy.cloudflare.build_command' '')"
          # The layer cache follows the same reasoning as the dependency cache:
          # `gha` with mode=max sends every intermediate layer through the
          # runner's uplink (edilio 2026-08-24: 438 s of a 634 s build; still
          # 913 s for one image on 2026-11-13), `local` keeps it on the runner's
          # work volume. On a hosted runner the default is none: Deploy runs on
          # a release event, whose cache scope is the new tag, and the next
          # release's tag cannot read it. edilio 2026-11-15: 1.7 GB of
          # buildkit-blob entries under refs/tags/v0.8.0-beta.2, written by the
          # Deploy and never read again, half the repository's 10 GB cache, and
          # part of the 485 s the default image took to build and push. A
          # repository can still name any backend.
          DOCKER_CACHE_DEFAULT=none
          if jq -e 'index("self-hosted") != null' <<< "$RUNNER" >/dev/null; then DOCKER_CACHE_DEFAULT=local; fi
          DOCKER_CACHE=$(str '.deploy.docker.cache_backend' "$DOCKER_CACHE_DEFAULT")
          case "$DOCKER_CACHE" in
            gha|local|none) ;;
            *) echo "::error::$CONFIG_FILE: .deploy.docker.cache_backend must be gha, local or none, got '$DOCKER_CACHE'."; exit 1 ;;
          esac
          out docker-cache-backend "$DOCKER_CACHE"
          bool render-hook '.deploy.render.hook' false
          echo "stack=$STACK runner=$RUNNER provider=$PROVIDER targets=$TARGETS"

      # Two depths, for a repository that sets test.pr_command (fast mode).
      # Fast runs lint, the pr_command and build: every pull request and every
      # push. Full runs lint, test.command and build: a dispatch and a schedule
      # (how the tip of a branch gets its full Check before a release), a
      # hotfix (it goes straight into main), and a Release PR or a promotion
      # that has to be checked itself: the one is more than its base plus a
      # version, the other meets commits of its own on the base. Neither may
      # go green on the fast suite. Only the two events named here are fast;
      # anything else is full, and so is every run of a repository without a
      # pr_command.
      - name: How deep does this Check go?
        id: depth
        shell: bash
        env:
          FAST_MODE: ${{ steps.config.outputs.fast-mode }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          depth=full
          if [[ "${FAST_MODE:-}" == "true" ]]; then
            case "${EVENT_NAME:-}" in
              push) depth=fast ;;
              pull_request)
                case "${HEAD_REF:-}" in
                  hotfix/*|release/*|promote/*) ;;
                  *) depth=fast ;;
                esac
                ;;
            esac
          fi
          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          echo "Depth: $depth (fast mode ${FAST_MODE:-false}, ${EVENT_NAME:-no event}${HEAD_REF:+ from $HEAD_REF})"

      - name: Does this repository have a dev branch?
        id: dev
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Believe the name, not the status: GET /branches/dev has answered 200 with
          # name "main" on a repository without a dev branch (navigaite/nvgt-trunk-plugin).
          name=$(gh api "repos/$REPO/branches/dev" --jq '.name' 2>/dev/null || true)
          if [[ "$name" == "dev" ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Branch and title rules
        id: rules
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          DEV_EXISTS: ${{ steps.dev.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME:-}" != "pull_request" ]]; then
            echo "Not a pull request; nothing to guard."
            exit 0
          fi
          # Conventional commit subject: type, optional scope, optional breaking bang.
          # Squash merge makes this the commit subject Flaiky reads for the version (D45).
          TITLE_RE='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: [^ ].*$'
          if [[ ! "$PR_TITLE" =~ $TITLE_RE ]]; then
            echo "::error::PR title '$PR_TITLE' is not a conventional commit subject (type(scope)!: summary). Versions are derived from PR titles, so this cannot merge."
            exit 1
          fi
          if [[ "$PR_BASE" == "main" ]]; then
            if [[ "$PR_HEAD_REPO" != "$BASE_REPO" ]]; then
              echo "::error::Fork pull requests cannot target main."
              exit 1
            fi
            if [[ "$DEV_EXISTS" == "true" ]]; then
              case "$PR_HEAD" in
                dev|promote/*|hotfix/*|release/*) ;;
                *)
                  echo "::error::PRs into main must come from dev, promote/*, hotfix/* or release/* — feature work targets dev."
                  exit 1
                  ;;
              esac
            fi
          fi
          echo "✅ '$PR_TITLE' from $PR_HEAD into $PR_BASE is allowed"

      # A Check reads nothing but the tree it checks out: the code, the
      # lockfile, the caller's pin of this workflow and its pipeline.yaml are
      # all in it. A tree that passed once passes again, and the release flow
      # checks the same tree over and over: dev after a squash merge into an
      # unmoved base, the promotion PR, main after it, dev after the Release
      # PR. Every passing Check leaves a marker artifact named after its tree
      # ("Mark the checked tree"); one from this repository's own pipeline lets
      # Check report that result instead of recomputing it. Markers from a fork
      # do not count: a fork's pull request runs the workflow from its own head
      # and could upload any name. No marker, an API error included, runs the
      # Check.
      #
      # The marker's name carries the depth of the Check that left it:
      # pipeline-checked-tree-<tree> after a full Check (the only name there
      # was before the depths, so every older marker counts as full) and
      # pipeline-fast-tree-<tree> after a fast one. A full run stands down only
      # for a full marker; a fast run for either, since the full Check covers
      # what the fast one runs. In fast mode a dispatch and a schedule look
      # too: a second full run of a tree that already passed takes seconds.
      - name: Was this tree checked green before?
        id: tree
        if: >-
          github.event_name == 'push' || github.event_name == 'pull_request'
          || (steps.config.outputs.fast-mode == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DEPTH: ${{ steps.depth.outputs.depth }}
        run: |
          set -euo pipefail
          label="Full Check"; names=(pipeline-checked-tree)
          if [[ "${DEPTH:-full}" == "fast" ]]; then label="Fast Check"; names+=(pipeline-fast-tree); fi
          full() { echo "reuse=false" >> "$GITHUB_OUTPUT"; echo "$label: $1"; exit 0; }
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq '.tree.sha' 2>/dev/null) || full "the commits API did not answer"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || full "${SHA:0:7} names no tree"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          for name in "${names[@]}"; do
            runs=$(gh api "repos/$REPO/actions/artifacts?name=$name-$tree&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.repository_id != null
                      and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id]
                    | unique | .[]' 2>/dev/null) || full "the artifacts API did not answer"
            what="Lint, test and build"
            if [[ "$name" == "pipeline-fast-tree" ]]; then what="Lint, the fast tests and build"; fi
            for run in $runs; do
              info=$(gh api "repos/$REPO/actions/runs/$run" --jq '[.path, .head_branch, .head_sha] | @tsv' 2>/dev/null) || continue
              IFS=$'\t' read -r path branch head <<< "$info"
              [[ "$path" == ".github/workflows/ci.yaml" ]] || continue
              note="$what passed on the identical tree ${tree:0:7} in run $run ($branch at ${head:0:7}), so that result stands."
              { echo "reuse=true"; echo "note=$note"; } >> "$GITHUB_OUTPUT"
              echo "$note"
              exit 0
            done
          done
          full "no Check of tree ${tree:0:7} has passed yet"

      # A Release PR is the base tip plus one commit that writes the version and
      # the changelog. Flaiky rebuilds it on every merge into the base, so
      # checking it again re-runs lint, test and build on a tree the base's own
      # push run has already passed — on a single self-hosted runner that is ten
      # minutes of queue per merge. When the head is exactly that one commit,
      # every changed line outside CHANGELOG.md only swaps a version for the one
      # the title names, and the base tip's push run is green, Check reports the
      # base's result instead of recomputing it. Anything else, an API error
      # included, runs the full Check: this step can only ever say "the same as".
      #
      # A promotion (`promote/*`) is the same one commit, over the last Release
      # of the other branch instead of the base tip: the code that went green
      # as a beta, with the stable version written over it. It used to be the
      # second full Check of every change on its way to production (measured
      # 2026-11-13: of the ten runs one change causes, the feature PR and the
      # promotion were the two that ran lint, test and build). It reuses the
      # push run of the Release it promotes, provided the merge into the base
      # yields the head's own tree — a base with commits of its own is new code.
      #
      # In fast mode the base's push run is a fast Check, and a release must
      # not stand on that. A Release PR (`release/*`) then asks for more: the
      # tree of the base tip has to carry a full marker, left by a dispatched
      # or scheduled run of that branch (or by a hotfix's Check). Without one
      # the answer is `unverified`: Check fails at once, names the command
      # that runs the full Check, and runs nothing. That is never a reuse. A
      # Release PR that is more than its base plus a version is checked
      # itself, in full ("How deep does this Check go?"). The promotion's
      # rule is unchanged: it stands on the push run of the Release it
      # promotes. Where that fails, its own Check is a full one too.
      - name: Is this a Release PR over a green base?
        id: reuse
        if: >-
          github.event_name == 'pull_request' && steps.tree.outputs.reuse != 'true'
          && (startsWith(github.event.pull_request.head.ref, 'release/') || startsWith(github.event.pull_request.head.ref, 'promote/'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          FAST_MODE: ${{ steps.config.outputs.fast-mode }}
        run: |
          set -euo pipefail
          full() { echo "reuse=false" >> "$GITHUB_OUTPUT"; echo "Full Check: $1"; exit 0; }
          [[ "$PR_HEAD_REPO" == "$REPO" ]] || full "the head lives in another repository"
          SEMVER='[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][A-Za-z0-9]*(\.[0-9]+)?)?'
          [[ "$PR_TITLE" =~ ^chore\(release\):\ ($SEMVER)$ ]] || full "'$PR_TITLE' does not name a release version"
          VERSION="${BASH_REMATCH[1]}"
          # What the head is one commit over: the base tip for a Release PR, the
          # promoted Release for a promotion.
          GREEN_SHA="$BASE_SHA"; GREEN_NAME="$BASE_REF"; GREEN_BRANCH="&branch=$BASE_REF"
          if [[ "${HEAD_REF:-}" == promote/* ]]; then
            head=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq '[.tree.sha, (.parents | length), (.parents[0].sha // "")] | @tsv' 2>/dev/null) \
              || full "the commits API did not answer"
            IFS=$'\t' read -r head_tree parents parent <<< "$head"
            [[ "$parents" == "1" && "$parent" =~ ^[0-9a-f]{40}$ ]] || full "the promotion head is not one commit over a Release"
            merged_tree=$(gh api "repos/$REPO/git/commits/$MERGE_SHA" --jq '.tree.sha' 2>/dev/null) || full "the commits API did not answer"
            [[ "$merged_tree" =~ ^[0-9a-f]{40}$ && "$merged_tree" == "$head_tree" ]] \
              || full "merging into $BASE_REF does not yield the head's tree, so $BASE_REF has commits of its own"
            GREEN_SHA="$parent"; GREEN_NAME="the promoted Release"; GREEN_BRANCH=""
          fi
          compare=$(mktemp)
          gh api "repos/$REPO/compare/$GREEN_SHA...$HEAD_SHA" > "$compare" 2>/dev/null || full "the compare API did not answer"
          verdict=$(VERSION="$VERSION" COMPARE="$compare" python3 - 2>&1 <<'PY'
          import json, os, re, sys
          c = json.load(open(os.environ["COMPARE"]))
          v = os.environ["VERSION"]
          if c.get("status") != "ahead" or c.get("ahead_by") != 1 or c.get("behind_by") != 0:
              sys.exit("the head is not exactly one commit over the base tip")
          if len(c.get("files", [])) >= 300:
              sys.exit("the compare API lists at most 300 files, so this diff may be cut short")
          sem = re.compile(r"v?\d+\.\d+\.\d+(?:-[A-Za-z][A-Za-z0-9]*(?:\.\d+)?)?")
          def bumped(old, new):
              # One version token of `old` became v, on a line that declares a
              # version or holds nothing else; a dependency range never passes.
              for m in sem.finditer(old):
                  pre, post = old[: m.start()], old[m.end() :]
                  lead = "v" if m.group(0).startswith("v") else ""
                  if new != pre + lead + v + post:
                      continue
                  if re.search(r"\bversion\b", pre, re.I) or (pre + post).strip() == "":
                      return True
              return False
          for f in c.get("files", []):
              name, status = f["filename"], f.get("status")
              if name == "CHANGELOG.md" and status in ("modified", "added"):
                  continue
              if status != "modified" or "patch" not in f:
                  sys.exit(name + " is " + str(status) + ", not a version edit")
              minus, plus = [], []
              for line in f["patch"].split("\n"):
                  if line.startswith("-"):
                      minus.append(line[1:])
                  elif line.startswith("+"):
                      plus.append(line[1:])
              if len(minus) != len(plus) or not all(bumped(o, n) for o, n in zip(minus, plus)):
                  sys.exit(name + " changes more than its version")
          PY
          ) || full "$verdict"
          if [[ "${FAST_MODE:-}" == "true" && "${HEAD_REF:-}" == release/* ]]; then
            # Fails closed: an API that does not answer is "not verified" too.
            # Re-running all jobs of this run asks again.
            unverified() {
              { echo "reuse=false"; echo "unverified=true"; echo "unverified-note=$1"; } >> "$GITHUB_OUTPUT"
              echo "Not fully verified: $1"
              exit 0
            }
            green_tree=$(gh api "repos/$REPO/git/commits/$GREEN_SHA" --jq '.tree.sha' 2>/dev/null) \
              || unverified "the commits API did not answer, so nothing shows that $GREEN_NAME at ${GREEN_SHA:0:7} passed the full Check"
            [[ "$green_tree" =~ ^[0-9a-f]{40}$ ]] \
              || unverified "${GREEN_SHA:0:7} names no tree, so nothing shows that $GREEN_NAME passed the full Check"
            # The same conditions as "Was this tree checked green before?":
            # live, from this repository's own pipeline, never from a fork.
            runs=$(gh api "repos/$REPO/actions/artifacts?name=pipeline-checked-tree-$green_tree&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.repository_id != null
                      and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id]
                    | unique | .[]' 2>/dev/null) \
              || unverified "the artifacts API did not answer, so nothing shows that $GREEN_NAME at ${GREEN_SHA:0:7} passed the full Check"
            for run in $runs; do
              path=$(gh api "repos/$REPO/actions/runs/$run" --jq '.path' 2>/dev/null) || continue
              [[ "$path" == ".github/workflows/ci.yaml" ]] || continue
              note="The full Check passed on $GREEN_NAME at ${GREEN_SHA:0:7} (tree ${green_tree:0:7}, run $run); this head adds only the version and the changelog, so that result stands."
              { echo "reuse=true"; echo "base-sha=$GREEN_SHA"; echo "note=$note"; } >> "$GITHUB_OUTPUT"
              echo "Reusing the full Check of $GREEN_NAME at ${GREEN_SHA:0:7}: the head only writes $VERSION and the changelog."
              exit 0
            done
            unverified "$GREEN_NAME at ${GREEN_SHA:0:7} (tree ${green_tree:0:7}) has not passed the full Check"
          fi
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$GREEN_SHA&event=push$GREEN_BRANCH&per_page=20" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yaml" and .conclusion == "success")] | length' 2>/dev/null) \
            || full "the runs API did not answer"
          [[ "$runs" =~ ^[1-9] ]] || full "$GREEN_NAME at ${GREEN_SHA:0:7} has no green push run of the pipeline yet"
          note="Lint, test and build passed on $GREEN_NAME at ${GREEN_SHA:0:7}; this head adds only the version and the changelog, so that result stands."
          { echo "reuse=true"; echo "base-sha=$GREEN_SHA"; echo "note=$note"; } >> "$GITHUB_OUTPUT"
          echo "Reusing the Check of $GREEN_NAME at ${GREEN_SHA:0:7}: the head only writes $VERSION and the changelog."

      # Last in Guard, once both reuse steps have spoken. The full name is the
      # one a release stands on, so it is written only by a run that was full
      # itself or stood down for a full marker of its very own tree. A fast
      # run writes the fast name, also when it stood down for a full marker.
      # So does every run that stood down under the Release PR rule in fast
      # mode: its tree is another commit's plus a version, which the rule
      # checks anew each time instead of taking it from a marker.
      - name: Name the tree marker
        id: marker
        shell: bash
        env:
          DEPTH: ${{ steps.depth.outputs.depth }}
          FAST_MODE: ${{ steps.config.outputs.fast-mode }}
          RELEASE_RULE: ${{ steps.reuse.outputs.reuse }}
        run: |
          set -euo pipefail
          name=pipeline-fast-tree
          if [[ "${DEPTH:-}" == "full" ]] && ! [[ "${FAST_MODE:-}" == "true" && "${RELEASE_RULE:-}" == "true" ]]; then
            name=pipeline-checked-tree
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "A green Check marks its tree as $name."

  check:
    name: Check
    needs: guard
    if: github.event_name != 'release'
    runs-on: ${{ fromJSON(needs.guard.outputs.check-runner) }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: write # trunk posts lint annotations through the Checks API
    env:
      STACK: ${{ needs.guard.outputs.stack }}
      PM: ${{ needs.guard.outputs.package-manager }}
      # Guard found this very tree checked green before, or a Release PR whose
      # tree is the green base tip plus the version and the changelog: every
      # step below stands down and the job reports that result, on a hosted
      # runner, in seconds.
      REUSE: ${{ needs.guard.outputs.reuse }}
    steps:
      # Fast mode only. The first step, and it fails: every step below is
      # skipped, so nothing is checked and no marker is written. Re-running
      # only the failed job would repeat Guard's old answer; the whole run has
      # to be re-run for Guard to look again.
      - name: Not fully verified
        id: unverified
        if: needs.guard.outputs.unverified == 'true'
        shell: bash
        env:
          NOTE: ${{ needs.guard.outputs.unverified-note }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "### Not fully verified"
            echo
            echo "$NOTE."
            echo
            echo "A Release PR is green only when the tip of its base branch has passed the full Check. Run it:"
            echo
            echo '```sh'
            echo "gh workflow run ci.yaml --ref $BASE_REF -R $REPO"
            echo '```'
            echo
            echo "A green full run re-runs this Pipeline run by itself. By hand, re-run all jobs of it, not only the failed one: Guard has to look again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Not fully verified: $NOTE. Run the full Check on $BASE_REF with: gh workflow run ci.yaml --ref $BASE_REF -R $REPO — a green full run re-runs this run by itself; by hand, re-run all jobs of it, not only the failed one."
          exit 1

      - name: Reuse an earlier Check
        if: env.REUSE == 'true'
        shell: bash
        env:
          NOTE: ${{ needs.guard.outputs.reuse-note }}
        run: |
          set -euo pipefail
          echo "::notice::$NOTE"
          echo "$NOTE" >> "$GITHUB_STEP_SUMMARY"

      # /tmp is noexec on the hardened rootless homelab runners; tooling that
      # mktemp+execs (esbuild, swc, native modules) needs an exec-capable tmp.
      # No-op on GitHub-hosted runners.
      - name: Route tmp to the runner workdir
        if: env.REUSE != 'true'
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.REUSE != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # trufflehog scans the commit range

      # TruffleHog runs as the pinned binary, not the container action: the
      # homelab runners are rootless with no Docker socket.
      - name: Secret scan
        if: env.REUSE != 'true' && needs.guard.outputs.security == 'true' && needs.guard.outputs.trufflehog == 'true'
        shell: bash
        env:
          TRUFFLEHOG_VERSION: v3.93.4
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FAIL_ON_SECRETS: ${{ needs.guard.outputs.fail-on-secrets }}
        run: |
          set -euo pipefail
          ZERO_SHA=0000000000000000000000000000000000000000
          BIN_DIR="${RUNNER_TEMP}/trufflehog-bin"
          mkdir -p "$BIN_DIR"
          curl -sSfL "https://raw.githubusercontent.com/trufflesecurity/trufflehog/${TRUFFLEHOG_VERSION}/scripts/install.sh" \
            | sh -s -- -b "$BIN_DIR" "${TRUFFLEHOG_VERSION}"
          ARGS=(git "file://${GITHUB_WORKSPACE}" --no-update --fail --only-verified)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ARGS+=(--since-commit "$PR_BASE_SHA" --branch "$PR_HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" && ( "$PUSH_BEFORE" == "$COMMIT_SHA" || "$PUSH_BEFORE" == "$ZERO_SHA" ) ]]; then
            ARGS+=(--since-commit "HEAD~10")
          else
            ARGS+=(--since-commit "$PUSH_BEFORE" --branch "$COMMIT_SHA")
          fi
          set +e
          "$BIN_DIR/trufflehog" "${ARGS[@]}"
          CODE=$?
          set -e
          if [[ "$CODE" -eq 0 ]]; then echo "✅ No verified secrets"; exit 0; fi
          if [[ "$CODE" -eq 183 ]]; then
            if [[ "$FAIL_ON_SECRETS" == "true" ]]; then echo "::error::TruffleHog found verified secrets. Remove them and rotate."; exit 1; fi
            echo "::warning::TruffleHog found verified secrets (fail_on_secrets is off)."; exit 0
          fi
          echo "::error::TruffleHog exited $CODE"; exit "$CODE"

      # The dependency graph API needs a public repository or GHAS; private
      # repositories without it get a notice instead of a red Check.
      - name: Is the dependency graph available?
        id: depgraph
        if: |
          env.REUSE != 'true' &&
          needs.guard.outputs.security == 'true' && needs.guard.outputs.dependency-review == 'true' &&
          github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Visibility is not a proxy: a public repository can have the graph switched off and a
        # private one can have it through GHAS. Ask the compare endpoint the review action itself
        # calls: it answers 200 only when the graph is on and, on a private repository, GHAS is
        # licensed. (The SBOM endpoint answers 200 without GHAS and turned every private
        # repository's first Check red.)
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" --silent 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependency review
        if: env.REUSE != 'true' && steps.depgraph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ needs.guard.outputs.fail-on-vulnerabilities == 'true' && 'moderate' || 'critical' }}
          warn-only: ${{ needs.guard.outputs.fail-on-vulnerabilities != 'true' }}
          comment-summary-in-pr: never
      - name: Dependency review unavailable
        if: env.REUSE != 'true' && steps.depgraph.outcome == 'success' && steps.depgraph.outputs.available != 'true'
        shell: bash
        run: |
          echo "::notice::Dependency review skipped: this repository has no dependency graph (enable it under Settings > Security, or GHAS for private repositories)."

      # Node before pnpm: pnpm/action-setup v6 bootstraps pnpm with `npm ci`, taking npm from
      # PATH, and a self-hosted runner's system Node may have none (the homelab images had Node 18
      # and no npm, 2026-10-11). Neither action caches: see "Locate the dependency cache".
      - name: Set up Node.js
        if: env.REUSE != 'true' && env.STACK == 'nodejs'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ needs.guard.outputs.node-version }}
      - name: Set up pnpm (from package.json)
        if: env.REUSE != 'true' && env.STACK == 'nodejs' && env.PM == 'pnpm' && needs.guard.outputs.pnpm-version == ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up pnpm (latest)
        if: env.REUSE != 'true' && env.STACK == 'nodejs' && env.PM == 'pnpm' && needs.guard.outputs.pnpm-version != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.guard.outputs.pnpm-version }}

      # The package store is restored on every Check and saved only by a push.
      # A cache is scoped to the ref that saved it, and a pull request can read
      # its base branch's entries but no other pull request's, so the built-in
      # caches of setup-node and pnpm/action-setup (which save on every miss)
      # stored one copy per pull request: edilio 2026-11-15, 26 entries of
      # 311 MB, most of them never read again, evicting the base branch's.
      # Now the base branch holds the one copy every pull request starts from.
      - name: Locate the dependency cache
        id: deps
        if: env.REUSE != 'true' && env.STACK == 'nodejs' && needs.guard.outputs.cache != ''
        shell: bash
        env:
          CACHE: ${{ needs.guard.outputs.cache }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            pnpm) dir=$(pnpm store path --silent); lock=pnpm-lock.yaml ;;
            npm) dir=$(npm config get cache); lock=package-lock.json ;;
            yarn) if [[ "$(yarn --version)" == 1.* ]]; then dir=$(yarn cache dir); else dir=$(yarn config get cacheFolder); fi; lock=yarn.lock ;;
            *) echo "::error::Unknown dependency cache '$CACHE'"; exit 1 ;;
          esac
          prefix="deps-$CACHE-$RUNNER_OS-$RUNNER_ARCH-"
          { echo "path=$dir"; echo "prefix=$prefix"; echo "key=$prefix$(sha256sum "$lock" | cut -c1-64)"; } >> "$GITHUB_OUTPUT"
      - name: Restore the dependency cache
        id: deps-restore
        if: env.REUSE != 'true' && steps.deps.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.deps.outputs.path }}
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.prefix }}
      - name: Set up Python
        if: env.REUSE != 'true' && env.STACK == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.guard.outputs.python-version }}

      - name: Install dependencies
        if: env.REUSE != 'true' && env.STACK != 'none'
        shell: bash
        run: |
          set -euo pipefail
          case "$STACK" in
            nodejs)
              case "$PM" in
                pnpm) pnpm install --frozen-lockfile ;;
                yarn) yarn install --frozen-lockfile ;;
                npm) if [[ -f package-lock.json ]]; then npm ci; else npm install; fi ;;
                *) echo "::error::Unknown package manager '$PM'"; exit 1 ;;
              esac ;;
            python)
              python -m pip install --upgrade pip
              if [[ -f requirements.txt ]]; then pip install -r requirements.txt; fi
              if [[ -f requirements-dev.txt ]]; then pip install -r requirements-dev.txt; fi
              if [[ -f pyproject.toml && ! -f requirements.txt ]]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi ;;
          esac
      - name: Save the dependency cache
        if: >-
          env.REUSE != 'true' && steps.deps.outputs.key != '' && github.event_name == 'push'
          && steps.deps-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.deps.outputs.path }}
          key: ${{ steps.deps.outputs.key }}

      # runtime.build_cache: a task runner's result cache (turbo's, for one)
      # that outlives the job. Restored on every Check: a pull request reads the
      # newest entry its base branch saved. Saved only by a push, once every
      # step passed, under a new key per run, so the base branch always offers
      # its latest state and no pull request stores a copy nobody else can read.
      # The key's lockfile and Node parts make a new lockfile or Node start from
      # the closest older entry instead of an exact one; the repository's own
      # hashing decides what is replayed (edilio: scripts/ci-turbo.sh).
      - name: Name the build cache
        id: build-cache
        if: env.REUSE != 'true' && needs.guard.outputs.build-cache == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node=$(node --version 2>/dev/null || echo none)
          lock=$(cat pnpm-lock.yaml package-lock.json yarn.lock 2>/dev/null | sha256sum | cut -c1-16)
          base="build-$RUNNER_OS-$RUNNER_ARCH-node-$node-"
          {
            echo "path=$HOME/.cache/pipeline-build-cache"
            echo "key=$base$lock-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "restore-keys<<EOF"; echo "$base$lock-"; echo "$base"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/.cache/pipeline-build-cache"
          echo "PIPELINE_BUILD_CACHE_DIR=$HOME/.cache/pipeline-build-cache" >> "$GITHUB_ENV"
      - name: Restore the build cache
        id: build-cache-restore
        if: env.REUSE != 'true' && steps.build-cache.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build-cache.outputs.path }}
          key: ${{ steps.build-cache.outputs.key }}
          restore-keys: ${{ steps.build-cache.outputs.restore-keys }}

      - name: Which linter?
        id: linter
        if: env.REUSE != 'true' && needs.guard.outputs.lint == 'true'
        shell: bash
        env:
          LINT_COMMAND_B64: ${{ needs.guard.outputs.lint-command-b64 }}
        run: |
          set -euo pipefail
          LINT_COMMAND=$(base64 -d <<< "$LINT_COMMAND_B64")
          if [[ -z "$LINT_COMMAND" && -f .trunk/trunk.yaml ]]; then echo "trunk=true" >> "$GITHUB_OUTPUT"; else echo "trunk=false" >> "$GITHUB_OUTPUT"; fi
      - name: Lint (trunk)
        if: env.REUSE != 'true' && needs.guard.outputs.lint == 'true' && steps.linter.outputs.trunk == 'true'
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        env:
          PIPELINE_DEPTH: ${{ needs.guard.outputs.depth }}
        with:
          # ~/.cache/trunk follows the dependency cache: a runner that keeps its
          # package store keeps trunk's tools as well.
          cache: ${{ needs.guard.outputs.dependency-cache != 'false' }}
      - name: Lint
        if: env.REUSE != 'true' && needs.guard.outputs.lint == 'true' && steps.linter.outputs.trunk != 'true'
        shell: bash
        env:
          LINT_COMMAND_B64: ${{ needs.guard.outputs.lint-command-b64 }}
          PIPELINE_DEPTH: ${{ needs.guard.outputs.depth }}
        run: |
          set -euo pipefail
          LINT_COMMAND=$(base64 -d <<< "$LINT_COMMAND_B64")
          if [[ -n "$LINT_COMMAND" ]]; then bash -eo pipefail -c "$LINT_COMMAND"
          elif [[ "$STACK" == "nodejs" ]] && jq -e '.scripts.lint' package.json >/dev/null; then "$PM" run lint
          elif [[ "$STACK" == "python" ]] && command -v ruff >/dev/null; then ruff check .
          else echo "::notice::No lint command configured and none detected; skipped."; fi

      - name: Test
        id: test
        if: env.REUSE != 'true' && needs.guard.outputs.test == 'true'
        shell: bash
        env:
          TEST_COMMAND_B64: ${{ needs.guard.outputs.test-command-b64 }}
          TEST_PR_COMMAND_B64: ${{ needs.guard.outputs.test-pr-command-b64 }}
          # fast or full, for the repository's own scripts in Lint, Test and
          # Build. Older pins of this workflow do not set it: unset means full.
          PIPELINE_DEPTH: ${{ needs.guard.outputs.depth }}
          CI: 'true'
        run: |
          set -euo pipefail
          TEST_COMMAND=$(base64 -d <<< "$TEST_COMMAND_B64")
          # A fast Check runs test.pr_command in place of test.command. Only
          # then: a full Check never reads it.
          if [[ "${PIPELINE_DEPTH:-full}" == "fast" ]]; then
            TEST_PR_COMMAND=$(base64 -d <<< "$TEST_PR_COMMAND_B64")
            if [[ -n "$TEST_PR_COMMAND" ]]; then TEST_COMMAND="$TEST_PR_COMMAND"; fi
          fi
          if [[ -n "$TEST_COMMAND" ]]; then bash -eo pipefail -c "$TEST_COMMAND"
          elif [[ "$STACK" == "nodejs" ]] && jq -e '.scripts.test' package.json >/dev/null; then "$PM" test
          elif [[ "$STACK" == "python" ]] && [[ -d tests ]]; then python -m pytest
          else echo "::notice::No test command configured and none detected; skipped."; fi
      # Whatever the tests leave behind (Playwright traces, screenshots, reports)
      # is only worth keeping when they failed. The attempt is part of the name
      # because artifacts are immutable (since v4) and a failed Check is the one
      # that gets re-run.
      - name: Upload test artifacts
        if: failure() && steps.test.outcome == 'failure' && needs.guard.outputs.test-artifact-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ needs.guard.outputs.test-artifact-path }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        if: env.REUSE != 'true' && needs.guard.outputs.build == 'true'
        shell: bash
        env:
          BUILD_COMMAND_B64: ${{ needs.guard.outputs.build-command-b64 }}
          PIPELINE_DEPTH: ${{ needs.guard.outputs.depth }}
          APP_ENV: preview
        run: |
          set -euo pipefail
          BUILD_COMMAND=$(base64 -d <<< "$BUILD_COMMAND_B64")
          if [[ -n "$BUILD_COMMAND" ]]; then bash -eo pipefail -c "$BUILD_COMMAND"
          elif [[ "$STACK" == "nodejs" ]] && jq -e '.scripts.build' package.json >/dev/null; then "$PM" run build
          else echo "::notice::No build command configured and none detected; skipped."; fi
      # After every step that may write to it, and only when all of them passed.
      - name: Save the build cache
        if: env.REUSE != 'true' && steps.build-cache.outputs.key != '' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.build-cache.outputs.path }}
          key: ${{ steps.build-cache.outputs.key }}
      - name: Upload build artifact
        if: env.REUSE != 'true' && needs.guard.outputs.build == 'true' && needs.guard.outputs.artifact-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ github.sha }}
          path: ${{ needs.guard.outputs.artifact-path }}
          retention-days: 7

      # The record Guard's "Was this tree checked green before?" looks for:
      # only its name matters, the content is for a person reading it. Last,
      # so a marker exists only when every step above passed. It is written on
      # a reused Check too: a Release PR that stood down on its base's result
      # vouches for its own tree, and that tree is what dev carries once the
      # Release PR is squashed. `overwrite` so a re-run never fails on the name
      # an earlier attempt of the same run used. A re-run does not reuse its own
      # first attempt (GitHub hides that attempt's artifacts from the lookup,
      # measured 2026-10-14); a later run of the same tree does. The name
      # says how deep the Check went (Guard, "Name the tree marker").
      - name: Write the tree marker
        if: needs.guard.outputs.tree != ''
        shell: bash
        env:
          TREE: ${{ needs.guard.outputs.tree }}
        run: |
          printf '{"tree":"%s","sha":"%s","run":"%s","attempt":"%s"}\n' \
            "$TREE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/checked-tree.json"
      - name: Mark the checked tree
        if: needs.guard.outputs.tree != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.guard.outputs.marker }}-${{ needs.guard.outputs.tree }}
          path: ${{ runner.temp }}/checked-tree.json
          retention-days: 30
          overwrite: true

  # Fast mode only, after a dispatched or scheduled full Check went green and
  # its marker is up: the Release PR onto this branch failed as "not fully
  # verified" and would now pass. This job re-runs that Pipeline run, whole,
  # so Guard answers again; nobody has to click. It is a job of its own
  # because re-running needs `actions: write`, and Check must not hold that:
  # Check runs the repository's code beside the checkout's token. Here nothing
  # is checked out and nothing from the repository is executed. The caller
  # has to grant `actions: write` (the rendered caller does); a called
  # workflow may not ask for more than its caller grants. The job-level `if`
  # keeps it from starting at all on a pull request, on a push and in a
  # repository without test.pr_command, so no runner is billed there. It never
  # fails the workflow: whatever goes wrong is a notice.
  recheck:
    name: Recheck Release PR
    needs: [guard, check]
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && needs.check.result == 'success'
      && needs.guard.outputs.fast-mode == 'true' && needs.guard.outputs.depth == 'full'
      && needs.guard.outputs.tree != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write # re-run the Release PR's Pipeline run
      pull-requests: read # find the Release PR onto this branch
    steps:
      - name: Re-run the Release PR this full Check unblocks
        id: rerun
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE:-}" != "branch" || -z "${BRANCH:-}" ]]; then echo "Not a branch; no Release PR targets it."; exit 0; fi
          base=$(jq -rn --arg b "$BRANCH" '$b | @uri')
          prs=$(gh api "repos/$REPO/pulls?state=open&base=$base&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("release/")) | [.number, .head.sha, (.head.repo.full_name // "")] | @tsv' 2>/dev/null) || {
            echo "::notice::Could not list the pull requests into $BRANCH. If a Release PR there failed as not fully verified, re-run all jobs of its Pipeline run."
            exit 0
          }
          if [[ -z "$prs" ]]; then echo "No open Release PR into $BRANCH."; exit 0; fi
          while IFS=$'\t' read -r number sha head_repo; do
            [[ "$number" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ && "$head_repo" == "$REPO" ]] || continue
            by_hand="Re-run all jobs of the Pipeline run of Release PR #$number by hand (not only the failed one)"
            run=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=pull_request&per_page=20" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yaml")] | first // empty | [.id, (.conclusion // "")] | @tsv' 2>/dev/null </dev/null) || {
              echo "::notice::The full Check passed, but the workflow runs of Release PR #$number could not be read. $by_hand."
              continue
            }
            IFS=$'\t' read -r id conclusion <<< "$run"
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then echo "Release PR #$number has no Pipeline run on ${sha:0:7}."; continue; fi
            if [[ "$conclusion" != "failure" ]]; then echo "Release PR #$number: run $id is '${conclusion:-still running}', nothing to re-run."; continue; fi
            # All jobs, not only the failed ones: Guard's answer is what has to change.
            if gh run rerun "$id" -R "$REPO" >/dev/null 2>&1 </dev/null; then
              echo "::notice::Re-running run $id of Release PR #$number: $BRANCH has now passed the full Check."
            else
              echo "::notice::The full Check passed, but run $id of Release PR #$number could not be re-run (the caller has to grant actions: write). $by_hand: gh run rerun $id -R $REPO"
            fi
          done <<< "$prs"

  deploy:
    name: Deploy (${{ matrix.target.name }})
    needs: guard
    if: github.event_name == 'release' && github.event.action == 'published' && needs.guard.outputs.deploy-provider != 'none'
    runs-on: ${{ fromJSON(needs.guard.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      packages: write # ghcr
      id-token: write # OIDC: npm trusted publishing
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.guard.outputs.deploy-targets) }}
    environment:
      name: ${{ github.event.release.prerelease && 'preview' || 'production' }}
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event.release.prerelease && 'preview' || 'production' }}
      PROVIDER: ${{ needs.guard.outputs.deploy-provider }}
    steps:
      - name: Route tmp to the runner workdir
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Flaiky releases a commit SHA, so the checkout is a detached HEAD and
      # `vercel deploy` records the branch as "HEAD". Put the branch the release
      # came from back on that commit: a prerelease is cut from dev (main in a
      # repository without one), a stable release from main.
      - name: Name the released branch
        id: branch
        if: env.PROVIDER == 'vercel'
        shell: bash
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then CANDIDATES=(dev main); else CANDIDATES=(main); fi
          for BRANCH in "${CANDIDATES[@]}"; do
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
              git checkout -q -B "$BRANCH"
              echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
              echo "Deploying the release from $BRANCH"
              exit 0
            fi
          done
          echo "::warning::None of ${CANDIDATES[*]} exists on origin; the deployment's branch stays HEAD."

      # The provider actions, at exactly the commit this workflow was pinned to.
      - name: Checkout the pipeline's actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maxbec/pipeline
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          sparse-checkout: .github/actions

      - name: Release version
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG to $DEPLOY_ENVIRONMENT"

      # Node before pnpm, for the npm pnpm/action-setup bootstraps with; see Check.
      - name: Set up Node.js
        if: env.PROVIDER != 'docker-ghcr'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ needs.guard.outputs.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Set up pnpm (from package.json)
        if: env.PROVIDER != 'docker-ghcr' && needs.guard.outputs.package-manager == 'pnpm' && needs.guard.outputs.pnpm-version == ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up pnpm (latest)
        if: env.PROVIDER != 'docker-ghcr' && needs.guard.outputs.package-manager == 'pnpm' && needs.guard.outputs.pnpm-version != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ needs.guard.outputs.pnpm-version }}
      # Restore only: a release event's cache scope is its tag, which no later
      # run can read, but it can read the default branch's entry that Check's
      # pushes save.
      - name: Locate the dependency cache
        id: deps
        if: (env.PROVIDER == 'cloudflare-workers' || env.PROVIDER == 'npm') && needs.guard.outputs.cache != ''
        shell: bash
        env:
          CACHE: ${{ needs.guard.outputs.cache }}
        run: |
          set -euo pipefail
          case "$CACHE" in
            pnpm) dir=$(pnpm store path --silent); lock=pnpm-lock.yaml ;;
            npm) dir=$(npm config get cache); lock=package-lock.json ;;
            yarn) if [[ "$(yarn --version)" == 1.* ]]; then dir=$(yarn cache dir); else dir=$(yarn config get cacheFolder); fi; lock=yarn.lock ;;
            *) echo "::error::Unknown dependency cache '$CACHE'"; exit 1 ;;
          esac
          prefix="deps-$CACHE-$RUNNER_OS-$RUNNER_ARCH-"
          { echo "path=$dir"; echo "prefix=$prefix"; echo "key=$prefix$(sha256sum "$lock" | cut -c1-64)"; } >> "$GITHUB_OUTPUT"
      - name: Restore the dependency cache
        if: steps.deps.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.deps.outputs.path }}
          key: ${{ steps.deps.outputs.key }}
          restore-keys: ${{ steps.deps.outputs.prefix }}
      - name: Install dependencies
        if: env.PROVIDER == 'cloudflare-workers' || env.PROVIDER == 'npm'
        shell: bash
        env:
          PM: ${{ needs.guard.outputs.package-manager }}
        run: |
          set -euo pipefail
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            *) if [[ -f package-lock.json ]]; then npm ci; else npm install; fi ;;
          esac

      # The provider build commands arrive base64-encoded, because GitHub drops
      # a job output it suspects of holding a credential. A step output inside
      # one job is not scanned, so this is where they become readable again.
      - name: Decode the provider build commands
        id: cmd
        if: env.PROVIDER == 'vercel' || env.PROVIDER == 'cloudflare-workers'
        shell: bash
        env:
          VERCEL_B64: ${{ needs.guard.outputs.vercel-build-command-b64 }}
          CLOUDFLARE_B64: ${{ needs.guard.outputs.cloudflare-build-command-b64 }}
        run: |
          set -euo pipefail
          emit() {
            { echo "$1<<PIPELINE_EOF"; base64 -d <<< "$2"; echo; echo "PIPELINE_EOF"; } >> "$GITHUB_OUTPUT"
          }
          emit vercel "$VERCEL_B64"
          emit cloudflare "$CLOUDFLARE_B64"

      - name: Deploy to Vercel
        if: env.PROVIDER == 'vercel'
        uses: ./.pipeline/.github/actions/deploy-vercel
        env:
          APP_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-scope: ${{ needs.guard.outputs.vercel-scope }}
          preview-alias: ${{ needs.guard.outputs.vercel-preview-alias }}
          environment: ${{ env.DEPLOY_ENVIRONMENT }}
          github-token: ${{ github.token }}
          build-command: ${{ steps.cmd.outputs.vercel }}

      - name: Deploy to Cloudflare Workers
        if: env.PROVIDER == 'cloudflare-workers'
        uses: ./.pipeline/.github/actions/deploy-cloudflare
        env:
          APP_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          environment: ${{ env.DEPLOY_ENVIRONMENT }}
          build-command: ${{ steps.cmd.outputs.cloudflare }}
          wrangler-config: ${{ needs.guard.outputs.cloudflare-config }}
          github-token: ${{ github.token }}

      - name: Image metadata
        id: meta
        if: env.PROVIDER == 'docker-ghcr'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          IMAGE_SUFFIX: ${{ matrix.target.name }}
          IMAGE_NAME_OVERRIDE: ${{ matrix.target.image_name }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EXTRA_BUILD_ARGS: ${{ matrix.target.build_args }}
        run: |
          set -euo pipefail
          REPO_LOWER="${REPO,,}"
          if [[ -n "$IMAGE_NAME_OVERRIDE" ]]; then NAME="$IMAGE_NAME_OVERRIDE"
          elif [[ -n "$IMAGE_SUFFIX" && "$IMAGE_SUFFIX" != "default" && "$IMAGE_SUFFIX" != "app" ]]; then NAME="${REPO_LOWER}-${IMAGE_SUFFIX}"
          else NAME="$REPO_LOWER"; fi
          # A stable release moves :latest (what production stacks pull); a
          # prerelease moves :dev (what the preview stack pulls). Both keep :<version>.
          if [[ "$PRERELEASE" == "true" ]]; then CHANNEL=dev; else CHANNEL=latest; fi
          BUILD_ARGS="APP_VERSION=${VERSION}"
          if [[ -n "$EXTRA_BUILD_ARGS" ]]; then BUILD_ARGS+=$'\n'"$EXTRA_BUILD_ARGS"; fi
          {
            echo "image-name=$NAME"
            echo "image-tag=$VERSION"
            echo "version-tag=$CHANNEL"
            echo "build-args<<PIPELINE_EOF"; printf '%s\n' "$BUILD_ARGS"; echo "PIPELINE_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        if: env.PROVIDER == 'docker-ghcr'
        uses: ./.pipeline/.github/actions/deploy-docker
        with:
          dockerfile: ${{ matrix.target.dockerfile || 'Dockerfile' }}
          context: ${{ matrix.target.context || '.' }}
          image-name: ${{ steps.meta.outputs.image-name }}
          image-tag: ${{ steps.meta.outputs.image-tag }}
          version-tag: ${{ steps.meta.outputs.version-tag }}
          registry: ghcr
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          build-args: ${{ steps.meta.outputs.build-args }}
          platforms: ${{ matrix.target.platforms || 'linux/amd64' }}
          cache-backend: ${{ needs.guard.outputs.docker-cache-backend }}
          cache-scope: ${{ matrix.target.name }}
      # Watchtower on the host polls the registry; nothing to trigger here.
      - name: Render deploy hook
        if: |
          env.PROVIDER == 'docker-ghcr' && needs.guard.outputs.render-hook == 'true' &&
          env.DEPLOY_ENVIRONMENT == 'production' && matrix.target.name == needs.guard.outputs.primary-target
        uses: ./.pipeline/.github/actions/deploy-render
        with:
          deploy-hook-url: ${{ secrets.RENDER_DEPLOY_HOOK }}
          environment: production
          service-name: ${{ github.event.repository.name }}
          github-token: ${{ github.token }}

      # Trusted publishing: npm mints provenance from the OIDC token; NPM_TOKEN
      # is only for packages that have not been switched over yet.
      - name: Publish to npm
        if: env.PROVIDER == 'npm'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PM: ${{ needs.guard.outputs.package-manager }}
          BUILD_COMMAND_B64: ${{ needs.guard.outputs.build-command-b64 }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          BUILD_COMMAND=$(base64 -d <<< "$BUILD_COMMAND_B64")
          if [[ -n "$BUILD_COMMAND" ]]; then bash -eo pipefail -c "$BUILD_COMMAND"
          elif jq -e '.scripts.build' package.json >/dev/null; then "$PM" run build; fi
          TAG_ARGS=()
          if [[ "$PRERELEASE" == "true" ]]; then TAG_ARGS=(--tag next); fi
          npm publish --access public "${TAG_ARGS[@]}"
