name: Flama Policy

on:
  pull_request:
    branches: [dev]

permissions:
  checks: read
  contents: read

jobs:
  policy:
    uses: maxbec/flama-delivery-platform/.github/workflows/reusable-policy.yml@330544867f40c1116222ef2769db9da8a8d627cd
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      paperclip-app-slug: flama-delivery-maxbec
      platform-sha: 330544867f40c1116222ef2769db9da8a8d627cd
      profile: major
