---
name: Release

run-name: "Release | ${{ github.actor }}"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    name: 📦 Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📦 Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # NOTE: GITHUB_TOKEN is sufficient in this repo (no rulesets, no
      # required checks). Known limitation: PRs created by GITHUB_TOKEN do
      # not trigger workflows — acceptable since nothing is required to
      # merge the release PR. The stable release PR itself remains
      # board-only: agents never merge it.

      - name: 🏷️ Move floating major tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: ${{ steps.release.outputs.major }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "Moving v${MAJOR} to ${SHA} (${TAG})"
          if ! gh api -X PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${MAJOR}" \
            -f sha="${SHA}" -F force=true; then
            # Tag does not exist yet (first release of a new major) — create it
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/v${MAJOR}" -f sha="${SHA}"
          fi
          echo "✅ v${MAJOR} → ${TAG} (${SHA})"
