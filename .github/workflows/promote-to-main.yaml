---
name: 📤 Promote dev → main

# Reusable workflow that opens a promotion PR from `dev` to `main` for
# Profile B repos (large repos with dev + main + prereleases).
#
# Why a workflow:
#   - One-click promotion via Actions UI ("Run workflow" button) or via
#     `gh workflow run promote.yml -R <owner>/<repo>` from external tools
#     (AI-OS, automation).
#   - Reusable so all Profile B repos share the same preconditions
#     (no open release-please PR on dev, dev ahead of main, no duplicate
#     promotion PR already open).
#
# Why a `promote/*` staging branch instead of a raw `dev → main` PR:
#   The org ruleset makes `dev` squash-only, so `main` is never an ancestor of
#   `dev`. release-please writes the changelog AND the version-bearing files on
#   BOTH tracks (beta on `dev`, stable on `main`), so after any stable release
#   those files three-way-conflict on every promotion — a raw `dev → main` PR
#   is unmergeable in the UI (this is what forced the manual conflict surgery in
#   #250/#252). This workflow builds a pre-resolved `promote/*` branch =
#   `main` + merge(`dev`) with the release-managed files resolved to `main`'s
#   side (its stable changelog is authoritative; release-please re-derives the
#   stable entry for the promoted commits after the merge lands). Any OTHER
#   conflict is a genuine code conflict — the workflow fails closed so a human
#   resolves it rather than silently dropping a change.
#
# The promotion PR is intentionally NOT auto-merged: GitHub strips downstream
# workflow triggers from token-initiated merges, and we want the resulting push
# to `main` to fire the universal pipeline (deploy + Sentry release). The board
# merges the `promote/* → main` PR via the GitHub UI (a GitHub-signed merge
# commit, satisfying `required_signatures` on `main`).
#
# In `auto` mode (one-button release flow, called from the universal pipeline
# on every push to `dev`): unmet preconditions soft-skip instead of failing,
# and an open-but-stale promotion PR is rebuilt in place (same PR number), so
# exactly one current promotion PR is open whenever `dev` is ahead of `main`.
# Auto mode still never merges the promotion PR — that stays the human button.
#
# Auto mode picks the promotion style per situation, so both Branch Guard
# styles work: when `dev` merges into `main` cleanly, the PR is opened with
# head `dev` directly (no branch push — also sidesteps the App `workflows`
# permission needed to push workflow-file changes, and some Flama Branch
# Guards only accept `dev`/`hotfix/*`/`release-please--*` heads on `main`).
# Only when a raw merge would conflict (release-managed files after a stable
# release) does it build the pre-resolved `promote/*` staging branch.

on:
  workflow_call:
    inputs:
      head:
        description: Source branch (default `dev`)
        required: false
        type: string
        default: dev
      base:
        description: Target branch (default `main`)
        required: false
        type: string
        default: main
      auto:
        description: >-
          Automation mode for the one-button release flow. Preconditions that
          are not met soft-skip (exit 0) instead of failing, and an already
          open promotion PR whose staged merge is stale relative to the
          current `head`/`base` tips is refreshed in place instead of skipped.
        required: false
        type: boolean
        default: false
    secrets:
      # Declared so nested callers (e.g. the universal pipeline's
      # promotion-pr job) can forward the App credential pair by name.
      # `secrets: inherit` callers are unaffected.
      WORKFLOW_APP_ID:
        description: GitHub App id used to author the promotion PR
        required: false
      WORKFLOW_APP_PRIVATE_KEY:
        description: Private key of the same GitHub App
        required: false

# `contents: write` is required to push the `promote/*` staging branch and to
# create the signed merge commit via the Git Data API.
permissions:
  contents: write
  pull-requests: write

# Serialize concurrent triggers so the duplicate-PR / staging-branch
# preconditions aren't racy (two parallel `workflow_dispatch` runs could
# otherwise both pass the existing-PR check before either lands).
concurrency:
  group: promote-${{ github.repository }}-${{ inputs.head }}-${{ inputs.base }}
  cancel-in-progress: false

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Mint a `navigaite-workflow-app` installation token. The promote PR must
      # be authored by the app, not `github.token`: GitHub suppresses workflow
      # runs for `GITHUB_TOKEN`-authored PR events (anti-recursion), so a
      # token-opened promote PR never fires the pipeline and its required checks
      # stay pending forever. Branch Guard already whitelists the app's
      # `promote/*` heads. Falls back to `github.token` when the app secrets are
      # absent (promote PR then needs a manual close/reopen to trigger checks).
      - name: 🔍 Check for GitHub App secrets
        id: check-app
        shell: bash
        env:
          APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            missing=()
            [[ -z "$APP_ID" ]] && missing+=("WORKFLOW_APP_ID")
            [[ -z "$APP_PRIVATE_KEY" ]] && missing+=("WORKFLOW_APP_PRIVATE_KEY")
            echo "::warning::${missing[*]} not set — falling back to GITHUB_TOKEN. The promote PR won't trigger its pipeline until manually reopened."
          fi

      - name: 🔑 Generate GitHub App token
        id: app-token
        if: steps.check-app.outputs.available == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          fetch-depth: 0
          # Persist the app token (when available) so `git push` of the
          # `promote/*` branch is attributed to the app and triggers the
          # pipeline, matching the `gh pr create` author below.
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HEAD: ${{ inputs.head }}
          BASE: ${{ inputs.base }}
          REPO: ${{ github.repository }}
          AUTO: ${{ inputs.auto }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Precondition 1: no open release-please PR on the source branch
          # (would race with the promotion and produce inconsistent changelogs).
          OPEN_RP=$(gh pr list --repo "$REPO" --base "$HEAD" \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please"))] | length')
          if [[ "$OPEN_RP" -gt 0 ]]; then
            if [[ "$AUTO" == "true" ]]; then
              echo "::notice::Open release-please PR on $HEAD — promotion deferred until it is merged."
              exit 0
            fi
            echo "::error::Open release-please PR on $HEAD. Merge or close it before promoting."
            exit 1
          fi

          # Precondition 2: source must have commits the target lacks.
          AHEAD=$(git rev-list --count "origin/$BASE..origin/$HEAD")
          if [[ "$AHEAD" -eq 0 ]]; then
            echo "::notice::$HEAD has no commits to promote to $BASE."
            exit 0
          fi

          BASE_SHA=$(git rev-parse "origin/$BASE")
          HEAD_SHA=$(git rev-parse "origin/$HEAD")

          # Commit summary since BASE — the promotion PR body doubles as the
          # release preview for the human pressing the button.
          # Bound the log with -n rather than piping into `head`. Under
          # `set -o pipefail`, `head` closing the pipe after 50 lines kills
          # `git log` with SIGPIPE and the whole pipeline returns 141, which
          # fails the step before it prints anything. It only bites in a
          # repository more than 50 commits ahead, so it presents as an
          # intermittent fault rather than an arithmetic one: edilio-app/edilio
          # failed every promotion while smaller repositories promoted fine.
          SUMMARY=$(git log --no-merges --pretty='- %h %s' -n 50 "origin/$BASE..origin/$HEAD")
          TOTAL=$(git rev-list --no-merges --count "origin/$BASE..origin/$HEAD")
          if [[ "$TOTAL" -gt 50 ]]; then
            SUMMARY=$(printf '%s\n- … and %s more commit(s)' "$SUMMARY" "$((TOTAL - 50))")
          fi

          # Precondition 3: an already open promotion PR — head is `promote/*`
          # or HEAD itself (direct-style promotion). Manual mode skips — the
          # open PR is the promotion. Auto mode keeps it current instead: a
          # direct HEAD-head PR tracks the branch by itself and only needs its
          # body refreshed; a stale `promote/*` staging branch is rebuilt in
          # place (same head branch, same PR number).
          EXISTING_JSON=$(gh pr list --repo "$REPO" --base "$BASE" --state open \
            --json url,headRefName,number \
            | jq -c --arg head "$HEAD" \
              '[.[] | select((.headRefName | startswith("promote/")) or .headRefName == $head)][0] // empty')
          EXISTING_NUMBER=""
          if [[ -n "$EXISTING_JSON" ]]; then
            EXISTING_URL=$(jq -r '.url' <<<"$EXISTING_JSON")
            EXISTING_HEAD=$(jq -r '.headRefName' <<<"$EXISTING_JSON")
            EXISTING_NUMBER=$(jq -r '.number' <<<"$EXISTING_JSON")
            if [[ "$AUTO" != "true" ]]; then
              echo "::notice::Promotion PR already open: $EXISTING_URL"
              echo "Promotion PR already open: [$EXISTING_URL]($EXISTING_URL)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$EXISTING_HEAD" == "$HEAD" ]]; then
              # Direct promotion PR: GitHub already shows the current diff;
              # refresh the body so the commit summary matches.
              BODY=$(printf '%s\n\n%s\n\n%s\n' \
                "Automated promotion of $AHEAD commit(s) from \`$HEAD\` to \`$BASE\`." \
                "### Commits since \`$BASE\`" \
                "$SUMMARY")
              gh pr edit "$EXISTING_NUMBER" --repo "$REPO" --body "$BODY" >/dev/null
              echo "::notice::Promotion PR refreshed (direct $HEAD → $BASE): $EXISTING_URL"
              echo "Promotion PR refreshed: [$EXISTING_URL]($EXISTING_URL)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            PROMOTE_BRANCH="$EXISTING_HEAD"
            git fetch origin "refs/heads/$PROMOTE_BRANCH"
            P1=$(git rev-parse -q --verify 'FETCH_HEAD^1' 2>/dev/null || true)
            P2=$(git rev-parse -q --verify 'FETCH_HEAD^2' 2>/dev/null || true)
            if [[ "$P1" == "$BASE_SHA" && "$P2" == "$HEAD_SHA" ]]; then
              echo "::notice::Promotion PR already up to date: $EXISTING_URL"
              echo "Promotion PR already up to date: [$EXISTING_URL]($EXISTING_URL)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::notice::Refreshing stale promotion PR $EXISTING_URL (staged merge is behind $HEAD/$BASE)."
          else
            # No promotion PR yet. In auto mode prefer the direct style when
            # HEAD merges cleanly into BASE: no branch push (no App `workflows`
            # permission needed for workflow-file changes) and a head accepted
            # by every Branch Guard variant. The `promote/*` staging branch is
            # only for merges that conflict on release-managed files.
            if [[ "$AUTO" == "true" ]] \
              && git merge-tree --write-tree "origin/$BASE" "origin/$HEAD" >/dev/null 2>&1; then
              BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
                "Automated promotion of $AHEAD commit(s) from \`$HEAD\` to \`$BASE\`." \
                "### Commits since \`$BASE\`" \
                "$SUMMARY" \
                "Merge via **Merge commit** (not squash) to preserve conventional commit history.")
              URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$HEAD" \
                --title "chore: promote $HEAD → $BASE" \
                --body "$BODY")
              echo "Opened: $URL"
              echo "Opened promotion PR (direct): [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            PROMOTE_BRANCH="promote/${BASE}-$(git rev-parse --short "origin/$HEAD")"
          fi

          # ------------------------------------------------------------------
          # Build the pre-resolved staging merge on top of BASE.
          # ------------------------------------------------------------------
          git checkout -B "$PROMOTE_BRANCH" "origin/$BASE"

          set +e
          git merge --no-ff --no-commit "origin/$HEAD"
          set -e

          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          if [[ -n "$CONFLICTS" ]]; then
            # Files release-please owns and rewrites on both tracks: the
            # changelog, the version manifests/locks, and any `extra-files`
            # declared in the stable release-please config. These are the only
            # files it is safe to resolve to BASE (main re-derives the stable
            # entry after the promotion lands).
            ALLOW=$'CHANGELOG.md\npackage.json\npackage-lock.json\npnpm-lock.yaml\nyarn.lock'
            # The release manifests are the most likely files to conflict of all
            # — each release track writes its own version into them — so they
            # must be resolvable too. Take the paths the repo actually declares,
            # falling back to release-please's defaults.
            MANIFESTS=$(yq -r '
              [.release.manifest_file, .release.manifest_file_stable]
              | map(select(. != null and . != "")) | .[]
            ' .github/pipeline.yaml 2>/dev/null || true)
            ALLOW=$(printf '%s\n%s\n%s\n' "$ALLOW" \
              $'.release-please-manifest.json\n.release-please-manifest.dev.json' \
              "$MANIFESTS")
            EXTRA=$(jq -r '
              .packages // {} | to_entries[] | .value["extra-files"] // []
              | .[] | if type == "object" then .path else . end
            ' .github/release-please-config.json 2>/dev/null || true)
            ALLOW=$(printf '%s\n%s\n' "$ALLOW" "$EXTRA" | sed '/^[[:space:]]*$/d' | sort -u)

            UNEXPECTED=""
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              grep -qxF "$f" <<<"$ALLOW" || UNEXPECTED+="  - $f"$'\n'
            done <<<"$CONFLICTS"

            if [[ -n "$UNEXPECTED" ]]; then
              git merge --abort
              echo "::error::Promotion has conflicts outside release-managed files; resolve $HEAD → $BASE manually."
              printf 'Unexpected conflicting files:\n%s' "$UNEXPECTED"
              exit 1
            fi

            # Keep BASE's version of every (release-managed) conflicting file.
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              git checkout --ours -- "$f"
              git add -- "$f"
            done <<<"$CONFLICTS"
            echo "::notice::Resolved release-managed conflicts to $BASE: $(tr '\n' ' ' <<<"$CONFLICTS")"
          fi

          MSG=$(printf 'chore: promote %s → %s\n\nRelease-managed files resolved to %s; release-please re-derives the stable changelog entry for the promoted commits after this lands.' "$HEAD" "$BASE" "$BASE")

          # Local merge commit (unsigned) — used only to upload the composed
          # merge tree to the remote.
          git commit --no-edit -m "$MSG"
          git push --force origin "HEAD:refs/heads/$PROMOTE_BRANCH"

          # Replace the unsigned runner commit with a GitHub-signed commit that
          # carries the identical tree and parents. Commits created through the
          # Git Data API with the Actions token are verified by GitHub, so the
          # eventual `promote/* → main` merge satisfies `required_signatures`.
          TREE=$(git rev-parse 'HEAD^{tree}')
          SIGNED=$(gh api "repos/$REPO/git/commits" \
            -f "message=$MSG" \
            -f "tree=$TREE" \
            -f "parents[]=$BASE_SHA" \
            -f "parents[]=$HEAD_SHA" \
            --jq '.sha')
          gh api -X PATCH "repos/$REPO/git/refs/heads/$PROMOTE_BRANCH" \
            -f "sha=$SIGNED" -F "force=true" >/dev/null

          NOTE="Release-managed files (changelog, version manifests, extra-files) were auto-resolved"
          NOTE+=" to \`$BASE\`; all other changes merged normally. Merge via the GitHub UI using"
          NOTE+=" **Merge commit** (not squash) to preserve conventional commit history and trigger"
          NOTE+=" downstream deploy/release workflows."
          BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Automated promotion of $AHEAD commit(s) from \`$HEAD\` to \`$BASE\`, staged via \`$PROMOTE_BRANCH\`." \
            "### Commits since \`$BASE\`" \
            "$SUMMARY" \
            "$NOTE")
          if [[ -n "$EXISTING_NUMBER" ]]; then
            gh pr edit "$EXISTING_NUMBER" --repo "$REPO" --body "$BODY" >/dev/null
            echo "Refreshed: $EXISTING_URL"
            echo "Refreshed promotion PR: [$EXISTING_URL]($EXISTING_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$PROMOTE_BRANCH" \
              --title "chore: promote $HEAD → $BASE" \
              --body "$BODY")
            echo "Opened: $URL"
            echo "Opened promotion PR: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi
