---
name: 🗓️ Weekly Maintenance

on:
  workflow_call: {}
  schedule:
    # Run weekly on Monday at 2 AM UTC. Daily was wasteful — Trivy finds
    # the same vulnerabilities every run on repos that don't change daily,
    # and the 7-day cache TTL means we only need to sweep once a week.
    # Consumers that genuinely need daily sweeps can override via
    # workflow_call with their own schedule.
    - cron: '0 2 * * 1'
  workflow_dispatch: {} # Allow manual triggering

permissions: {}

jobs:
  cleanup-workflow-runs:
    name: 🧹 Cleanup Old Workflow Runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete workflow runs older than 30 days
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10

  cleanup-caches:
    name: 🗑️ Cleanup Old Caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cleanup old caches
        run: |
          set -euo pipefail
          echo "::group::🔍 Listing caches"
          gh cache list --limit 100
          echo "::endgroup::"

          echo "::group::🗑️ Deleting caches older than 7 days"
          gh cache list --limit 100 --json id,key,createdAt \
            | jq -r '.[] | select(.createdAt < (now - 604800 | todate)) | .id' \
            | xargs -I {} gh cache delete {} || true
          echo "::endgroup::"

          echo "✅ Cache cleanup completed"
        env:
          GH_TOKEN: ${{ github.token }}

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Check Trivy SARIF output
        id: trivy-output
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "trivy-results.sarif" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trivy did not produce trivy-results.sarif; skipping SARIF upload."
          fi

      # Code Scanning requires GHAS on private repos. When unavailable,
      # upload-sarif fails with "Code scanning is not enabled for this
      # repository". `continue-on-error: true` keeps the scheduled
      # maintenance run green while still surfacing the failure as an
      # annotation and in the summary table below — repos that later
      # enable GHAS will start publishing SARIF automatically without
      # any caller change.
      - name: Upload Trivy results to GitHub Security
        id: sarif-upload
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        if: steps.trivy-output.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Security Audit Summary
        if: always()
        shell: bash
        env:
          TRIVY_OUTCOME: ${{ steps.trivy-scan.outcome }}
          HAS_SARIF: ${{ steps.trivy-output.outputs.exists }}
          SARIF_UPLOAD_OUTCOME: ${{ steps.sarif-upload.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### 🔒 Security Audit"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Trivy Step | $TRIVY_OUTCOME |"
            echo "| SARIF Produced | $HAS_SARIF |"
            echo "| SARIF Upload | ${SARIF_UPLOAD_OUTCOME:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-workflows:
    name: 🔍 Lint Workflow Definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          # 1.7.12 knows the `ubuntu-slim` runner; 1.7.7 reported it as unknown.
          # The checksum is the one from the release's checksums file.
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --strict
          tar xzf /tmp/actionlint.tar.gz -C /tmp
          sudo mv /tmp/actionlint /usr/local/bin/
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          ERRORS=$(actionlint -oneline 2>&1 || true)
          {
            echo "### 🔍 Workflow Lint"
            if [[ -z "$ERRORS" ]]; then
              echo "✅ All workflows pass actionlint"
            else
              echo "⚠️ actionlint found issues:"
              echo '```'
              echo "$ERRORS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the findings with color in the job log AND fail the job when
          # actionlint reports issues. The previous `actionlint -color || true`
          # swallowed the exit code, so workflow-lint errors never failed
          # nightly maintenance.
          actionlint -color

  maintenance-summary:
    name: 📊 Maintenance Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - cleanup-workflow-runs
      - cleanup-caches
      - security-audit
      - lint-workflows
    if: always()
    steps:
      - name: Generate summary
        env:
          RESULT_CLEANUP_WORKFLOWS: ${{ needs.cleanup-workflow-runs.result }}
          RESULT_CLEANUP_CACHES: ${{ needs.cleanup-caches.result }}
          RESULT_SECURITY_AUDIT: ${{ needs.security-audit.result }}
          RESULT_LINT_WORKFLOWS: ${{ needs.lint-workflows.result }}
        run: |
          set -euo pipefail
          {
            echo "### 🗓️ Weekly Maintenance Summary"
            echo ""
            echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| Task | Status |"
            echo "|------|--------|"
            echo "| Workflow Cleanup | $RESULT_CLEANUP_WORKFLOWS |"
            echo "| Cache Cleanup | $RESULT_CLEANUP_CACHES |"
            echo "| Security Audit | $RESULT_SECURITY_AUDIT |"
            echo "| Workflow Lint | $RESULT_LINT_WORKFLOWS |"
          } >> "$GITHUB_STEP_SUMMARY"
