---
# This repository runs the pipeline it ships, from its own tree, so a pull
# request here is checked by the very workflow it changes.
name: Pipeline

on:
  pull_request:
    branches: [dev, main]
    # The defaults plus ready_for_review: lifting a draft re-runs the pipeline,
    # and its completion is what the train hears. Guard reuses the same tree's
    # earlier Check, so that run is cheap.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  release:
    types: [published]
  # The full Check on demand, as in every repository's caller:
  #   gh workflow run ci.yaml --ref dev
  # No nightly schedule: .github/pipeline.yaml sets no `test.pr_command`, so
  # every Check here is the full one already.
  workflow_dispatch: {}

concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/universal-pipeline.yaml
    permissions:
      contents: read
      pull-requests: read
      # write: a green full Check re-runs the Check of a waiting Release PR.
      actions: write
      checks: write
      deployments: write
      packages: write
      id-token: write
    with:
      config-file: .github/pipeline.yaml
