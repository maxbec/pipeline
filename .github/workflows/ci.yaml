---
# This repository runs the pipeline it ships, from its own tree, so a pull
# request here is checked by the very workflow it changes.
name: Pipeline

on:
  pull_request:
    branches: [dev, main]
    # The defaults plus ready_for_review: lifting a draft re-runs the pipeline,
    # and its completion is what the train hears. Guard reuses the same tree's
    # earlier Check, so that run is cheap.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  release:
    types: [published]

concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/universal-pipeline.yaml
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
      deployments: write
      packages: write
      id-token: write
    with:
      config-file: .github/pipeline.yaml
